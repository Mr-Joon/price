$("btnCopyId").onclick = async () => { toast(await copyText(DEVICE_ID) ? "기기번호를 복사했습니다" : "복사 실패"); };
$("btnRecheck").onclick = async () => {
  const b = $("btnRecheck"); b.disabled = true; b.textContent = "확인 중…";
  try{
    if (await checkAuth()) sync(true);
    else toast(authState.status === "blocked" ? "사용이 중지된 기기입니다" : "아직 승인되지 않았습니다");
  }finally{ b.disabled = false; b.textContent = "다시 확인"; }
};
$("btnLockUpd").onclick = () => $("btnUpd").click();

/* =========================================================
   검색 입력 이벤트
   ========================================================= */
function setMode(m){
  mode = m;
  $("tabAll").classList.toggle("on", m==="all");
  $("tabCmp").classList.toggle("on", m==="cmp");
  $("rowB").hidden = (m!=="cmp");
  $("tagA").hidden = (m!=="cmp");
  render();
}
$("tabAll").onclick = () => setMode("all");
$("tabCmp").onclick = () => { setMode("cmp"); if (!$("qB").value) $("qB").focus(); };
$("btnSwap").onclick = () => {
  const a = $("qA").value; $("qA").value = $("qB").value; $("qB").value = a;
  for (const id of ["qA","qB"]) $(id).parentElement.classList.toggle("has", !!$(id).value);
  render();
};
let renderTimer = null;
function scheduleRender(ms){ clearTimeout(renderTimer); renderTimer = setTimeout(render, ms); }
for (const id of ["qA","qB"]){
  $(id).addEventListener("input", e => { e.target.parentElement.classList.toggle("has", !!e.target.value); scheduleRender(80); });
  $(id).addEventListener("compositionupdate", () => scheduleRender(60));   // 한글 조합 중에도 실시간 검색
  $(id).addEventListener("keydown", e => { if (e.key==="Enter"){ e.target.blur(); render(); } });  // 엔터 → 즉시 검색 + 키보드 닫기
}
document.querySelectorAll(".clr").forEach(b => b.onclick = () => {
  const inp = $(b.dataset.for); inp.value = ""; inp.parentElement.classList.remove("has"); render(); inp.focus();
});
$("btnSync").onclick = async () => {
  if (syncing || updating){ toast("확인 중입니다. 잠시 후 다시 눌러 주세요"); return; }
  if (imgBusy){ toast("이미지를 받는 중입니다 (⚙ 설정에서 진행 상황 확인)"); return; }
  retryStep = 0; clearRetry();
  await sync(true);   // 버전 확인 → 바뀐 게 있으면 안내 팝업 (없으면 '최신' 알림)
};

// 검색 초기화 (PC 초기화와 동일): 두 검색창을 비우고 처음 화면으로
$("btnClearSearch").onclick = () => {
  clearTimeout(renderTimer);
  for (const id of ["qA","qB"]){ $(id).value = ""; $(id).parentElement.classList.remove("has"); }
  setMode("all");
  window.scrollTo(0, 0);
  $("qA").focus();
};

// 앱으로 돌아왔을 때 5분 지났으면 변경 확인
// 폰이 깨어난 직후엔 인터넷이 아직 안 붙었을 수 있어 1.5초 뒤 확인
let wakeTimer = null;
document.addEventListener("visibilitychange", () => {
  clearTimeout(wakeTimer);
  if (document.hidden) return;
  wakeTimer = setTimeout(() => {
    if (document.hidden) return;
    if (syncErr || Date.now() - lastCheck > CHECK_INTERVAL_MS){ retryStep = 0; sync(false); }   // 실패 상태면 바로 다시 시도
    else checkAppUpdate();   // 앱으로 돌아올 때마다 새 버전 확인 (가벼움)
  }, 1500);
});
setInterval(() => { if (!document.hidden) sync(false); }, CHECK_INTERVAL_MS);
window.addEventListener("online", () => { retryStep = 0; clearRetry(); setTimeout(() => sync(false), 1500); });

/* =========================================================
   시작
   ========================================================= */
lsDel("rps_data"); lsDel("rps_cfg");   // 이전 버전 저장값 정리
if (authState.status !== "ok") showLock(authState.status);   // 승인 전이면 처음부터 잠금 화면
updateAdminBadge(null);
if (loadCache()) showMetaStatus();
restoreSearch();
render();
restoreScroll();
renderCart();
updateImgInfo();
(async () => {
  if (imgMeta && imgMeta.count) { await loadImagesFromDb(); render(); restoreScroll(); }   // 이미지가 들어간 뒤 위치 다시 맞춤
  sync(false);
})();

/* =========================================================
   새 버전 알림: GitHub에 새 버전을 올리면 화면 위에 [업데이트] 띠 표시
   (sw.js 안의 버전 번호만 확인 → 1KB 정도라 데이터 거의 안 씀)
   ========================================================= */
let newVersion = null, updChecking = false;
function verCmp(a, b){
  const x = String(a).split(".").map(Number), y = String(b).split(".").map(Number);
  for (let i = 0; i < Math.max(x.length, y.length); i++){ const d = (x[i] || 0) - (y[i] || 0); if (d) return d; }
  return 0;
}
async function checkAppUpdate(){
  if (updChecking || !location.protocol.startsWith("http")) return;
  updChecking = true;
  try{
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 10000);
    const r = await fetch("sw.js", { cache: "no-store", signal: ctl.signal }).finally(() => clearTimeout(t));
    if (!r.ok) return;
    const m = (await r.text()).match(/rps-v([\d.]+)/);
    if (m && verCmp(m[1], VERSION) > 0){
      newVersion = m[1];
      $("updText").textContent = `새 버전(v${newVersion})이 있습니다`;
      $("updBar").hidden = false;
      $("btnLockUpd").hidden = false;
    }
  }catch(e){}
  finally{ updChecking = false; }
}
$("btnUpd").onclick = async () => {
  const btn = $("btnUpd");
  btn.disabled = true; btn.textContent = "업데이트 중…";
  try{
    // 새 화면을 미리 받아 두고 확인 (GitHub 반영이 덜 됐으면 기다리도록 안내)
    const r = await fetch("index.html", { cache: "reload" });
    const m = (await r.text()).match(/const VERSION = "([\d.]+)"/);
    if (!m || verCmp(m[1], VERSION) <= 0){
      toast("새 버전 준비 중입니다. 몇 분 뒤 다시 눌러 주세요");
      btn.disabled = false; btn.textContent = "업데이트"; return;
    }
    try{ await fetch(location.pathname, { cache: "reload" }); }catch(e){}
    try{ const reg = await navigator.serviceWorker.getRegistration(); if (reg) await reg.update(); }catch(e){}
  }catch(e){
    toast("인터넷 연결을 확인하세요");
    btn.disabled = false; btn.textContent = "업데이트"; return;
  }
  location.reload();   // 검색어·견적함은 그대로 유지됨
};

// 오프라인 실행용 서비스워커
if ("serviceWorker" in navigator && location.protocol.startsWith("http")){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>
