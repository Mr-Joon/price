<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef2f8" id="metaTheme">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="판매가검색기">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>판매가 검색기 v1.0.29</title>
<script>
  // 화면이 깜빡이지 않도록 테마를 가장 먼저 적용
  try{ const t = localStorage.getItem("rps_theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; }catch(e){}
</script>
<style>
/* ===== 색상: 라이트 기본 / 다크는 [설정] 또는 폰 설정(자동)을 따름 ===== */
:root{
  --bg:#eef2f8; --card:#ffffff; --text:#1b2433; --sub:#6b7688; --line:#dde3ec;
  --brand:#1f5fbf; --brand-d:#174a96; --reward:#d9480f; --ok:#2b8a3e; --warn:#c92a2a;
  --cmp:#7048e8; --cmp-d:#5235b8; --cmp-bg:#f3f0ff; --cmp-line:#d0bfff;
  --btn:#f6f8fb; --btn-d:#c9d1dd; --chip:#e7eefb; --thumb:transparent;
  --green:#2f9e44; --green-d:#237a34;
  --logo:#386cb9;   /* HPT 로고 색 (제목 글자도 같은 색) */
}
:root[data-theme="dark"]{
  --bg:#11161f; --card:#1b2230; --text:#e7ecf4; --sub:#93a0b4; --line:#2b3446;
  --brand:#4d8cf0; --brand-d:#2f63b8; --reward:#ff8a4c; --ok:#5cc275; --warn:#ff6b6b;
  --cmp:#b197fc; --cmp-d:#7a5fd0; --cmp-bg:#231d38; --cmp-line:#4b3d7a;
  --btn:#263043; --btn-d:#0c1018; --chip:#22314b; --thumb:rgba(255,255,255,.09); --green:#37b24d; --green-d:#1f7a30;
  --logo:#5280c8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11161f; --card:#1b2230; --text:#e7ecf4; --sub:#93a0b4; --line:#2b3446;
    --brand:#4d8cf0; --brand-d:#2f63b8; --reward:#ff8a4c; --ok:#5cc275; --warn:#ff6b6b;
    --cmp:#b197fc; --cmp-d:#7a5fd0; --cmp-bg:#231d38; --cmp-line:#4b3d7a;
    --btn:#263043; --btn-d:#0c1018; --chip:#22314b; --thumb:rgba(255,255,255,.09); --green:#37b24d; --green-d:#1f7a30;
    --logo:#5280c8;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{overscroll-behavior-y:none}   /* 맨 위에서 쓸어내려도 새로고침되지 않게 */
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
body{padding-bottom:env(safe-area-inset-bottom)}

/* ===== 상단 고정 영역 ===== */
.top{position:sticky;top:0;z-index:10;background:var(--bg);
  padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;border-bottom:1px solid var(--line)}
.head{display:flex;align-items:center;gap:8px}
.title{font-size:18px;font-weight:800;color:var(--logo);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ver{font-size:11px;font-weight:600;color:var(--sub);margin-left:4px}
.titleBox{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:3px}
.titleBox .title{flex:none;max-width:100%}
/* 로고: 한 가지 색 그림을 모양(마스크)으로 쓰고 색은 --logo로 칠함 → 제목 글자와 항상 같은 색, 다크모드도 자동 */
.logo{display:block;height:20px;width:107px;max-width:100%;cursor:pointer;background:var(--logo);
  -webkit-mask:var(--logo-img) left center/contain no-repeat;mask:var(--logo-img) left center/contain no-repeat;
  --logo-img:url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAMAAAAAkCAYAAADfCTWTAAAHL0lEQVR42u1cW2wUZRT+zj+7bCm9EBEohERi0EqQQOll18QYH4xuSwBTQ73EGFAuQmt8Mj4Zq08mxkQTutSKEknQWKKVYEorMagvdHdbaCAlIAQFMbSYipSWXnbnPz6UQrvtTnE7e3aZ9n/ZzCX/nDnzfefyz7dDsBiFlU1r3ITdzFRMBEIyBvNPkUhkfVvduptWp3krmzaA6EMCHkqKGWANUG1w1zOVscdKKpu2EOF9Ai2CUwajl4EOgJsxqD8L7im7PCEGttXnut3ZNYB6DoQMx9w+I8Lg6rigXrppb0benMUXQViQbGNMba4PB8oOWRHRRQgTSCXblsgQL26r818Z2S7e0fSUYdAROHrwIANvB3f5PxkXeKqaviTQK468a/BQXEDlZeU9LQF+AFBkDFgdd4FekAA/M9jVp/tG7zMUvQzHD/IQ6GNvVdObo/cuK230EPC8Y+8a6FXxwaB8Uob0DnDbJKd4hUw5E9xf1hMTJXyYLoPpvRU767NGNuctRQFAHufeL0IqPju4RMYGnOv43P9P3BM21hsAFwl5JDh6a/WmhrlElD9d8E+E3CzkFN9JzcrR5GfgmGviQ9UKgAgBiHXI6njJfTmPElGmTADEGAJ4Mj0lgg/jLYJuHdnWUVZwqTzFXMZQLyVtESJmaGI1yqilMldNzdBa/zIhAbzbSx4BUbaIEUwtlgRxk1fMIVEdHBsRSYwA/dG+fSdry69OcOgrX1XTNYCqZJiofruTAfC7c6M/fxfeXfbrxBnAreRApxGapFGRAmF/65nQqZiri/iBmf+IA/5bToILSsSOznDA/+fIdrCrZ5d3YU4PgVay5ru3gKiACE8IAXkfNK7dtWkKg9AcDAZKGwCwK04t4JVIfQwe6u/uaZ/kofiIRPLwcfxcHY1xl0wZCOsgwERFQpXIWDsOVJhBYO//ncRb2VwLJJ8ADB7q7erZ2nGgYijROVRKV12YTlgZn//qwWwQlgtF4TGlmO/1w0ulloGZ4xNgWWmjhwirhfqQoE1TpQV+EiJA4bZDmQReKVR2WDp8boanSGL9f7jKiAGhkisDTa3j9kHDS5FwyWQiCk91jnTCT0IEIGUUgMiQITBPcgNyDXAUZjBmNUSm92A2O7t7j8c9bBjFQlmIo5HroSmTKK3wkwABDMG13+gkDTAUyzShQNeJmrUXYxzjk7k2nbp8oKI/vgu0iA+I+GxbXcX1qc6TVvhJKAOQzKoLM7qPB/zn06OWjIkkT1a7AFqTDmmcQcVCQSBkD5HSCj8JNcEyoCNrh3u3NC6RUl/GNn/e5Y+tElM+WqTxW2+iHxaxQ/M91QATOGzHPK6xoDu4EEQPyAQ+7i/Z0fysRX0ntfQHjkmlpMTePQARHRd4njmZxVJmaGDKgBLFD9lD2DEE0LPcJYaQwwlUTgbKrc6Qav5Uzzg5hlDphd7gp6EzFlGuQsIPDPTp6KX2KZNIED8wk0AAg9T0UT7eGeMUoCD2ygCP21dvWpUDNAw/09lu8sBYYBCvBBmbQSgTyoHfttVtj0y5ARbEj1YDIdsJABJM/WkzxkaSwm31ucyUL/HymYgez8jKvJba20dvNBJ5x6a0LrV0fD5UU95tx1SjmuBqxZh+BIhVgLrcuSVSyss0GP3aNDe01a27ZEtVLoefkF0T3c4Avp1F+QDlyBCYPyLiHyyiUjlIvSGSSscpQKdLEOAzpjZfDNeubbdjtsJtzfkEiOBHk7WCOMESyJB79W+ivrW2NC6LfVXNUn9DHK8AZfaBHJwAmI+DUdtyumXvePHfFOp/t/YCIqoVKI6GkkAAIenvjAJ05B5PEnGDSMTUdJOILw1BH4t9421jRyMkHUek+wK1208AsQZmRgF6yw9ft9T4P3BKYpH68xCB288fLhu0LZsAwJKN9bMBrBLy .status{font-size:12px;color:var(--sub);margin:6px 0 8px;min-height:16px}
.upd{display:flex;align-items:center;gap:8px;background:var(--chip);border:1.5px solid var(--brand);border-radius:12px;
  padding:7px 8px 7px 12px;margin-bottom:8px;font-size:14px;font-weight:700}
.upd span{flex:1}
.upd .b3d{font-size:14px;padding:7px 12px}
.status.err{color:var(--warn);font-weight:600}
.status.tap{cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.empty .b3d{margin-top:14px;min-width:160px}

/* ===== 3D 버튼 ===== */
.b3d{border:none;border-radius:10px;background:var(--btn);color:var(--text);
  font-size:15px;font-weight:700;padding:9px 12px;cursor:pointer;
  box-shadow:0 3px 0 var(--btn-d),0 4px 8px rgba(0,0,0,.12);
  transition:transform .05s,box-shadow .05s;font-family:inherit}
.b3d:active{transform:translateY(3px);box-shadow:0 0 0 var(--btn-d),0 1px 3px rgba(0,0,0,.15)}
.b3d:disabled{opacity:.5}
.b3d.pri,.b3d.on{background:var(--brand);color:#fff;box-shadow:0 3px 0 var(--brand-d),0 4px 8px rgba(0,0,0,.18)}
.b3d.pri:active,.b3d.on:active{box-shadow:0 0 0 var(--brand-d)}
.icon{width:40px;height:40px;padding:0;font-size:19px;display:grid;place-items:center;flex:none}
.b3d.grn{background:var(--green);color:#fff;box-shadow:0 3px 0 var(--green-d),0 4px 8px rgba(0,0,0,.18)}
.b3d.grn:active{box-shadow:0 0 0 var(--green-d)}
.b3d.red{color:var(--warn)}
.cartBtn{position:relative}
.badge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;
  background:var(--warn);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;border:2px solid var(--bg)}

/* ===== 모드 탭 ===== */
.tabs{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:10px}
.tabs .rst{padding-left:14px;padding-right:14px;white-space:nowrap}
.ico{width:22px;height:22px;display:block}

/* ===== 검색창 ===== */
.srow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.sbox{position:relative;flex:1}
.sbox input{width:100%;font-size:17px;padding:12px 42px 12px 14px;border-radius:12px;
  border:2px solid var(--line);background:var(--card);color:var(--text);outline:none;font-family:inherit}
.sbox input:focus{border-color:var(--brand)}
.sbox.c input:focus{border-color:var(--cmp)}
.sbox input::-webkit-search-cancel-button,.sbox input::-webkit-search-decoration{-webkit-appearance:none;appearance:none;display:none}
.sbox .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:none;
  background:var(--line);color:var(--sub);width:26px;height:26px;border-radius:50%;
  font-size:14px;display:none;cursor:pointer}
.sbox.has .clr{display:block}
.sbox .tag{position:absolute;left:-2px;top:-8px;font-size:10px;font-weight:800;color:#fff;
  background:var(--brand);border-radius:6px;padding:1px 6px}
.sbox .tag.c{background:var(--cmp)}

/* ===== 결과 ===== */
main{padding:10px 14px 30px}
.count{font-size:13px;color:var(--sub);margin:2px 2px 10px;font-weight:700}
.count.cmp{color:var(--cmp)}
.empty{text-align:center;color:var(--sub);padding:50px 10px;font-size:15px;line-height:1.7}
.card{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:10px;
  box-shadow:0 1px 3px rgba(0,0,0,.08);border:1px solid var(--line)}
.card.c{background:var(--cmp-bg);border-color:var(--cmp-line);margin-left:14px;border-left:4px solid var(--cmp)}
.chead{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
.chead .txt{flex:1;min-width:0}
.thumb{width:76px;height:76px;flex:none;border-radius:10px;background:var(--thumb);
  object-fit:contain;padding:3px;border:1.5px solid var(--line);cursor:zoom-in}
.model{font-size:18px;font-weight:800;word-break:break-all}
.card.c .model{font-size:16px;color:var(--cmp)}
.card.c .model small{font-size:11px;font-weight:700;margin-right:4px}
.desc{font-size:13px;color:var(--sub);margin-top:3px;line-height:1.4}
.prices{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.p{background:var(--bg);border-radius:9px;padding:6px 8px}
.card.c .p{background:var(--card)}
.p .l{font-size:11px;color:var(--sub)}
.p .v{font-size:15px;font-weight:800;margin-top:1px}
.p .d{font-size:11px;font-weight:700;margin-top:2px}
.p.rw .v{color:var(--reward)}
.d.higher{color:var(--warn)} .d.lower{color:var(--ok)} .d.same,.d.muted{color:var(--sub)}
.meta{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--sub);flex-wrap:wrap}
.memo{background:var(--chip);border-radius:6px;padding:2px 7px;color:var(--text)}
.cacts{margin-left:auto;display:flex;gap:6px}   /* 카드 오른쪽 버튼 묶음: [🔗 상세] [＋ 담기] */
.link{display:inline-flex;align-items:center;text-decoration:none;color:var(--text);font-size:13px;padding:6px 10px}
.add{font-size:13px;padding:6px 10px}

/* ===== 견적함 ===== */
.cart{display:flex;flex-direction:column;max-height:88vh;padding-bottom:calc(14px + env(safe-area-inset-bottom))}
.cart .chd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cart .chd h3{flex:1;margin:0}
.cart .loaded{font-size:12px;color:var(--sub);font-weight:600}
.clist{flex:1;overflow:auto;margin:0 -16px;padding:0 16px;min-height:60px}
.crow{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--bg)}
.crow .r1{display:flex;align-items:center;gap:8px}
.crow .nm{flex:1;font-weight:800;font-size:16px;word-break:break-all}
.crow .del{width:34px;height:34px;font-size:15px;padding:0}
.crow .r2{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.tg{display:flex;gap:6px}
.tg .b3d{font-size:13px;padding:6px 10px}
.unit{font-size:14px;font-weight:700;margin-left:auto}
.qty{display:flex;align-items:center;gap:6px}
.qty .b3d{width:34px;height:34px;padding:0;font-size:18px}
.qty .n{min-width:44px;text-align:center;font-size:16px;font-weight:800;border:1.5px solid var(--line);border-radius:8px;padding:5px 4px;background:var(--card);cursor:pointer}
.sub{margin-left:auto;font-size:15px;font-weight:800;color:var(--reward)}
.cfoot{border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
.ship{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700}
.ship input{width:22px;height:22px;accent-color:var(--brand)}
.tot{display:flex;align-items:baseline;justify-content:space-between;margin:8px 0 10px;font-weight:800}
.tot b{font-size:22px;color:var(--reward)}
.btn3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.btn2{display:grid;grid-template-columns:2fr 1fr;gap:8px}
.cempty{text-align:center;color:var(--sub);padding:30px 0;line-height:1.7}

/* ===== 대화상자 ===== */
.dlg{position:fixed;inset:0;z-index:65;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:20px}
.dlg .box{background:var(--card);color:var(--text);border-radius:16px;padding:18px 16px;width:100%;max-width:380px;max-height:80vh;display:flex;flex-direction:column}
.dlg h4{margin:0 0 8px;font-size:17px}
.dlg .msg{font-size:14px;line-height:1.6;white-space:pre-line;overflow:auto}
.dlg input{width:100%;font-size:16px;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--text);margin-top:10px;font-family:inherit}
.dlg .acts{display:grid;grid-auto-flow:column;gap:8px;margin-top:14px}
.dlg .acts.col{grid-auto-flow:row}
.qlist{overflow:auto;margin-top:6px}
.qitem{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.qitem .t{flex:1;min-width:0}
.qitem .t b{display:block;word-break:break-all}
.qitem .t small{color:var(--sub)}
.qitem .b3d{font-size:13px;padding:7px 10px}

/* ===== 이미지 크게 보기 ===== */
.viewer{position:fixed;inset:0;z-index:70;background:var(--bg);display:grid;place-items:center;padding:24px}
.viewer img{display:block;max-width:100%;max-height:70vh;background:var(--thumb);border:1.5px solid var(--line);border-radius:14px;padding:10px;margin:0 auto}
.viewer div{color:var(--text);font-weight:800;font-size:17px;margin-top:12px;text-align:center}

/* ===== 설정 시트 ===== */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none}
.mask.show{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--card);
  border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));
  transform:translateY(105%);transition:transform .2s;max-height:88vh;overflow:auto}
.sheet.show{transform:none}
.sheet h3{margin:0 0 4px;font-size:17px}
.sheet .sec{margin-top:16px}
.sheet .lab{font-size:13px;font-weight:800;margin-bottom:8px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg .b3d{font-size:14px;padding:9px 6px}
.sheet .hint{font-size:12px;color:var(--sub);line-height:1.5;margin-top:8px}
.sheet .hint.new{color:var(--reward);font-weight:700}
.sheet .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.sheet .full{width:100%;margin-top:18px}
/* ===== 잠금 화면 (승인 필요 / 사용 중지) ===== */
.lock{position:fixed;inset:0;z-index:75;background:var(--bg);display:grid;place-items:center;padding:24px;overflow:auto}
.lock .lbox{width:100%;max-width:360px;text-align:center}
.lock .lic{font-size:44px;margin-bottom:6px}
.lock h2{margin:0 0 8px;font-size:21px}
.lock p{margin:0 0 14px;color:var(--sub);font-size:14px;line-height:1.6}
.lock .devid{font-size:30px;font-weight:800;letter-spacing:2px;background:var(--card);border:2px dashed var(--brand);
  border-radius:14px;padding:14px 8px;margin:6px 0 16px;color:var(--brand);user-select:all}
.lock .lbtns{display:grid;grid-template-columns:2fr 1fr;gap:8px}
.lock .lbtns .full{grid-column:1/-1}
.lock .hint{font-size:12px;color:var(--sub);margin-top:14px}
.lock .req{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:10px}
.lock .req input{font-size:16px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--text);font-family:inherit;min-width:0}
.lock .done{color:var(--ok);font-weight:700;font-size:14px;margin-bottom:10px}
.setBtn{position:relative}
#btnSync{position:relative}
.dot{position:absolute;top:-4px;right:-4px;width:13px;height:13px;border-radius:50%;background:var(--warn);border:2px solid var(--bg)}
/* ===== 관리자: 사용자 관리 ===== */
.adm{display:flex;flex-direction:column;max-height:88vh;min-height:80vh;z-index:52}
.adm .tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.alist{flex:1;overflow:auto;margin:0 -16px;padding:0 16px;min-height:80px}
.urow{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--bg)}
.urow .u1{display:flex;align-items:center;gap:8px}
.urow .nm{flex:1;font-weight:800;font-size:16px;word-break:break-all}

<script>
"use strict";
/* =========================================================
   판매가 검색기 (모바일 PWA)
   - 검색/비교/카드 규칙: PC 판매가검색기 v6.3.21과 동일
   - 데이터: 구글 드라이브 data.xlsx / 이미지 zip (Drive API v3 + API 키)
   - 오프라인: 데이터는 localStorage, 이미지는 IndexedDB에 저장
   ========================================================= */
const VERSION = "1.0.29";

// 구글 드라이브 접속 정보 (PC 앱 v6.3.21과 같은 파일)
const EXCEL_FILE_ID = "1KoHNrv5atci3MWEk2C2v3xUnqsLAZhzf";       // data.xlsx
const IMAGE_ZIP_ID  = "1sfNfJwTvrK8yAlYOOoB__tNHf21VbvG8";        // 제품 이미지 zip
// 버전 확인용 파일 (PC와 동일): 파일 '이름'이 버전 → 이름의 숫자를 바꾸면 PC·모바일 모두 새로 받음
const DATA_VERSION_FILE_ID  = "1c-aWAHYse78f693bsgOgywJH1iPXuEYD";   // 가격표 버전 (예: data_version01.txt)
const IMAGE_VERSION_FILE_ID = "1VyPiRp-5xx8pgMGK9SATvOm9-lkE4Nny";   // 이미지 버전
const API_KEY       = "AIzaSyAMB2G_RWePWk0q0jddOmxscXNMeC3EuxM";  // mr-joon.github.io 전용 키
const USER_SHEET_ID = "1_OMhj2bGozo0Q8UGMpFAVLvf5-F3WHrTRM1xGJOYdJA"; // 사용자 명단 구글 시트 (기기번호 | 이름 | 허용)
const ADMIN_API_URL = "https://script.google.com/macros/s/AKfycbyJSK7whlOX---slUvYsfY-OEQYHkX0GbYp_gWNHskmTE_GQJwhY1cJaifXIkFB8oSb/exec";   // 사용자 관리 Apps Script 웹 앱 주소 (승인 요청·관리자 메뉴)

const CHECK_INTERVAL_MS = 5 * 60 * 1000;   // 5분마다 변경 확인
const DISPLAY_LIMIT = 100;                  // 검색 결과 표시 개수 상한 (PC와 동일)
const COMPARE_DISPLAY_LIMIT = 3;            // 메인 제품 1개당 비교 제품 수 (PC와 동일)
const SHIPPING_FEE = 4000;                  // 택배비 (PC와 동일)
const SHRINK_RATIO = 0.5;                   // 새 가격표 제품 수가 이전의 이 비율 미만이면 확인 (PC와 동일)
const IMAGE_EXTS = ["png","gif","jpg","jpeg"];
const LS = { data:"rps_data2", theme:"rps_theme", imgMode:"rps_img_mode", imgMeta:"rps_img_meta" };

// 엑셀 열 번호 (0부터, PC와 동일)
const COL_MODEL = 1, COL_DESC = 2, COL_BOX = 3, COL_NORMAL = 4, COL_DATE = 5, COL_REWARD = 6, COL_URL = 8;

const $ = id => document.getElementById(id);
$("ver").textContent = " v" + VERSION;

/* ---------- 저장소 (실패해도 앱은 동작) ---------- */
function lsGet(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
function lsGetStr(k, def){ try{ return localStorage.getItem(k) || def; }catch(e){ return def; } }
function lsSetStr(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }

/* ---------- 상태 ---------- */
let items = [];          // 상품 목록
let meta = null;         // {dataDate, dataVersion, syncedAt, checkedAt, source}
let mode = "all";        // all | cmp
let syncing = false;
let lastCheck = 0;
let byModel = new Map();   // 모델명 -> 상품 (견적함용)
const searchCache = new Map();

/* ---------- 유틸 ---------- */
function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove("show"), 2000);
}
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function hhmm(ts){ const d = new Date(ts), z = n => String(n).padStart(2,"0"); return `${d.getMonth()+1}/${d.getDate()} ${z(d.getHours())}:${z(d.getMinutes())}`; }
function text(v){ return v === null || v === undefined ? "" : String(v).trim(); }
function comma(n){ return Math.trunc(n).toLocaleString("ko-KR"); }
function mb(bytes){ return (bytes / 1048576).toFixed(1) + "MB"; }
function sizeText(bytes){ return bytes >= 1048576 ? mb(bytes) : Math.max(1, Math.round(bytes / 1024)) + "KB"; }   // 1MB 미만은 KB로

/* =========================================================
   테마 (자동 / 라이트 / 다크)
   ========================================================= */
function applyTheme(v){
  if (v === "light" || v === "dark") document.documentElement.dataset.theme = v;
  else delete document.documentElement.dataset.theme;
  const bg = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
  $("metaTheme").setAttribute("content", bg || "#eef2f8");
  document.querySelectorAll("#segTheme .b3d").forEach(b => b.classList.toggle("on", b.dataset.v === v));
}
let themeMode = lsGetStr(LS.theme, "auto");
applyTheme(themeMode);
document.querySelectorAll("#segTheme .b3d").forEach(b => b.onclick = () => {
  themeMode = b.dataset.v; lsSetStr(LS.theme, themeMode); applyTheme(themeMode);
});
try{ matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => applyTheme(themeMode)); }catch(e){}

/* =========================================================
   가격 / 링크 / 검색 (PC v6.3.21 규칙)
   ========================================================= */
function parsePriceInt(v){
  const n = Number(String(v ?? "0").replace(/,/g,"").trim());
  return (String(v ?? "").trim() !== "" && isFinite(n)) ? Math.trunc(n) : 0;
}
function isSafeUrl(u){
  try{ const x = new URL(String(u).trim()); return (x.protocol==="http:"||x.protocol==="https:") && !!x.hostname; }
  catch(e){ return false; }
}
function buildProductUrl(model){
  const cleaned = String(model||"").replace(/\(.*?\)/g, "").trim();
  if (!cleaned) return null;
  const slug = cleaned.toLowerCase().replace(/ /g, "");
  return slug ? "https://hptkorea.co.kr/product/" + encodeURIComponent(slug) + "/" : null;
}
function productUrl(it){
  const u = it.customUrl || buildProductUrl(it.model);
  return u && isSafeUrl(u) ? u : null;
}
function makeSearchKey(model, desc){ return (model + desc).toLowerCase().replace(/ /g, ""); }
function normalizeQuery(t){ return (t || "").toLowerCase().replace(/ /g, ""); }
function tokenize(t){ return String(t).toLowerCase().match(/[가-힣]+|[a-z0-9]+/g) || []; }
function stripGen(name){ return String(name).replace(/\s*[\(（][^\)）]*[\)）]/g, "").trim(); }
function preparePool(list){ return list.map(it => [it, stripGen(it.model), new Set(tokenize(it.model))]); }
function smartMatch(mainName, pool, limit = COMPARE_DISPLAY_LIMIT){
  const mainBase = stripGen(mainName), mainTokens = tokenize(mainName);
  const scored = [];
  pool.forEach(([item, compBase, compTokens], idx) => {
    if (item.model === mainName) return;
    if (compBase && compBase === mainBase){ scored.push([9999, idx, item]); return; }
    let s = 0;
    for (const t of mainTokens) if (compTokens.has(t)) s += t.length;
    if (s > 0) scored.push([s, idx, item]);
  });
  scored.sort((a,b) => b[0]-a[0] || a[1]-b[1]);   // 점수 높은 순, 동점이면 원래 순서
  return scored.slice(0, limit).map(x => x[2]);
}
function searchAll(query){
  const q = normalizeQuery(query);
  if (!q) return [];
  if (searchCache.has(q)) return searchCache.get(q);
  const matched = items.filter(it => it.key.includes(q));
  if (searchCache.size >= 256) searchCache.clear();
  searchCache.set(q, matched);
  return matched;
}

/* ---------- 엑셀 → 상품목록 (PC: _read_excel) ---------- */
function dateText(v){
  if (v instanceof Date && !isNaN(v)) { const z=n=>String(n).padStart(2,"0"); return `${v.getFullYear()}-${z(v.getMonth()+1)}-${z(v.getDate())}`; }
  return text(v);
}
function customUrl(v){
  let s = text(v);
  if (!s || s.toLowerCase() === "none") return "";
  if (!isSafeUrl(s)) s = "http://" + s;
  if (!isSafeUrl(s) || /\s/.test(s)) return "";
  try{ if (!new URL(s).hostname.includes(".")) return ""; }catch(e){ return ""; }   // "단종" 같은 한 단어는 링크가 아니라 메모
  return s;
}
function parseWorkbook(buf){
  const wb = XLSX.read(buf, {type:"array", cellDates:true});
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:null, blankrows:true});
  let dataDate = "";
  const list = [];
  rows.forEach((row, idx) => {
    row = row || [];
    if (idx === 0 && row[COL_DATE] != null) dataDate = dateText(row[COL_DATE]);
    if (row.length < 7) return;
    const model = text(row[COL_MODEL]);
    if (!model || model.toLowerCase() === "none" || model === "모델명") return;   // 제목행 제외
    const memoRaw = text(row[COL_URL]);
    const cu = customUrl(row[COL_URL]);
    list.push({
      model, desc: text(row[COL_DESC]),
      box: text(row[COL_BOX]),
      n: parsePriceInt(row[COL_NORMAL]),
      r: parsePriceInt(row[COL_REWARD]),
      customUrl: cu,
      memo: (!cu && memoRaw && memoRaw.toLowerCase() !== "none") ? memoRaw : "",
    });
  });
  if (!list.length) throw new Error("상품 데이터가 비어 있습니다");
  return { items:list, dataDate };
}
function indexItems(){
  byModel = new Map();
  for (const it of items){ it.key = makeSearchKey(it.model, it.desc); byModel.set(it.model, it); }   // 모델명이 겹치면 나중 것 (PC와 동일)
  searchCache.clear();
}

/* =========================================================
   제품 이미지 (드라이브 zip → 썸네일 → IndexedDB)
   ========================================================= */
let imgMode = lsGetStr(LS.imgMode, "off") === "off" ? "off" : "on";   // off | on (예전 수동·자동은 '켬'으로)

// IndexedDB 도우미
function idbOpen(){
  return new Promise((res, rej) => {
    const r = indexedDB.open("rps-images", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("img");
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function idbReplaceAll(entries){
  const db = await idbOpen();
  await new Promise((res, rej) => {
    const tx = db.transaction("img", "readwrite"), st = tx.objectStore("img");
    st.clear();
    for (const [k, blob] of entries) st.put(blob, k);
    tx.oncomplete = res; tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
  });
  db.close();
}
async function idbReadAll(){
  const db = await idbOpen();
  const out = await new Promise((res, rej) => {
    const tx = db.transaction("img", "readonly"), st = tx.objectStore("img");
    const map = new Map();
    const cur = st.openCursor();
    cur.onsuccess = () => { const c = cur.result; if (c){ map.set(c.key, c.value); c.continue(); } else res(map); };
    cur.onerror = () => rej(cur.error);
  });
  db.close();
  return out;
}
async function idbClear(){ try{ await idbReplaceAll([]); }catch(e){} }

function setImgUrls(map){
  for (const u of imgUrls.values()) URL.revokeObjectURL(u);
  imgUrls = new Map();
  for (const [k, blob] of map) imgUrls.set(k, URL.createObjectURL(blob));
}
async function loadImagesFromDb(){
  try{ setImgUrls(await idbReadAll()); }catch(e){ console.warn("이미지 불러오기 실패", e); }
}

// zip 안의 한글 파일명: UTF-8이 아니면 윈도우 한글(CP949)로 읽음
function decodeZipName(bytes){
  try{ return new TextDecoder("utf-8", {fatal:true}).decode(bytes); }
  catch(e){ try{ return new TextDecoder("euc-kr").decode(bytes); }catch(e2){ return String.fromCharCode(...bytes); } }
}

// 이미지는 원본 그대로 저장 (줄이거나 다시 압축하지 않음 → 화질 손실 없음)
const IMAGE_MIME = { png:"image/png", gif:"image/gif", jpg:"image/jpeg", jpeg:"image/jpeg" };
async function makeImageBlob(bytes, fname){
  const ext = fname.split(".").pop().toLowerCase();
  const blob = new Blob([bytes], { type: IMAGE_MIME[ext] || "application/octet-stream" });
  const bmp = await createImageBitmap(blob);        // 정상 이미지인지만 확인 (PC와 동일)
  if (bmp.close) bmp.close();
  return blob;
}

// 다운로드 (진행률 표시)
function fetchWithProgress(url, onProgress){
  return driveRequest(url, async (r, ctl, timer) => {
    clearTimeout(timer);                       // 응답이 오기 시작하면 전체 시간 제한 해제
    if (!r.body || !r.body.getReader) return await r.blob();
    const total = Number(r.headers.get("Content-Length")) || 0;
    const reader = r.body.getReader(), chunks = [];
    let got = 0, stall = null;
    const arm = () => { clearTimeout(stall); stall = setTimeout(() => ctl.abort(), 30000); };   // 30초간 진행 없으면 중단
    try{
      arm();
      for (;;){
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value); got += value.length;
        arm(); onProgress(got, total);
      }
    }finally{ clearTimeout(stall); }
    return new Blob(chunks);                   // 한 번 더 복사하지 않고 Blob으로 (메모리 절약)
  }, 15000);
}

const DRIVE = "https://www.googleapis.com/drive/v3/files/";
// 버전 파일의 '이름'을 읽음 (내용은 받지 않음, PC와 동일)
async function fetchVersion(id){
  const j = await driveJson(`${DRIVE}${id}?fields=name&supportsAllDrives=true&key=${API_KEY}`);
  const v = String((j && j.name) || "").trim();
  if (!v) throw new Error("버전 파일 이름을 읽지 못했습니다");
  return v;
}
function verLabel(v){ return String(v || "").replace(/\.[^.]+$/, ""); }   // "data_version01.txt" → "data_version01"
// 가격표 버전
async function getDataVersion(){
  const v = await fetchVersion(DATA_VERSION_FILE_ID);
  // 예전 방식(수정 시간)으로 받은 가격표: 지금 드라이브 파일과 같으면 다시 받지 않고 버전만 기록
  if (meta && meta.source === "drive" && !meta.dataVersion && meta.modifiedTime && items.length){

// 이미지 버전 + zip 크기 (크기는 버전이 바뀔 때만 다시 확인)
async function getImageInfo(){
  const v = await fetchVersion(IMAGE_VERSION_FILE_ID);
  let c = lsGet(LS_IMGSIZE);
  const migrate = !!(imgMeta && imgMeta.count && !imgMeta.version && imgMeta.modifiedTime);
  if (!c || c.version !== v || migrate){
    const z = await driveJson(`${DRIVE}${IMAGE_ZIP_ID}?fields=size,modifiedTime&supportsAllDrives=true&key=${API_KEY}`);
    c = { version: v, size: Number(z.size) || 0 }; lsSet(LS_IMGSIZE, c);
    if (migrate){   // 예전 방식으로 받은 이미지: 지금 zip과 같으면 버전만 기록
      if (z.modifiedTime === imgMeta.modifiedTime) imgMeta.version = v;
      delete imgMeta.modifiedTime; lsSet(LS.imgMeta, imgMeta);
    }
  }
  updateImgSize();
  return { version: v, size: c.size };
}
function updateImgSize(){
  const c = lsGet(LS_IMGSIZE);
  const size = (c && c.size) || (imgMeta && imgMeta.size) || 0;
  $("imgSize").textContent = size ? ` (현재 약 ${sizeText(size)})` : "";
}

async function downloadImages(info){
  if (imgBusy) return;
  imgBusy = true; updateImgInfo();
  try{
    if (!info) info = await getImageInfo();
    const base = DRIVE + IMAGE_ZIP_ID;
    const zipBlob = await fetchWithProgress(`${base}?alt=media&supportsAllDrives=true&key=${API_KEY}`, (got, total) => {
      setImgProgress(total ? `받는 중 ${Math.floor(got / total * 100)}% (${mb(got)} / ${mb(total)})` : `받는 중 ${mb(got)}`);
    });
    setImgProgress("압축 푸는 중…");
    let zip;
    try{ zip = await JSZip.loadAsync(zipBlob, { decodeFileName: decodeZipName }); }
    catch(e){ throw new Error("이미지 파일이 압축 파일(ZIP)이 아닙니다"); }
    const files = Object.values(zip.files).filter(f => {
      if (f.dir || f.name.includes("__MACOSX")) return false;
      const fname = f.name.replace(/\\/g, "/").split("/").pop();
      if (!fname || fname.startsWith("._")) return false;
      return IMAGE_EXTS.includes(fname.split(".").pop().toLowerCase());
    });
    if (!files.length) throw new Error("압축 파일 안에 이미지가 없습니다");
    const thumbs = new Map(), names = new Map(), dups = [];
    let i = 0, fail = 0;
    for (const f of files){
      i++;
      if (i % 5 === 1) setImgProgress(`이미지 정리 중 ${i}/${files.length}`);
      const fname = f.name.replace(/\\/g, "/").split("/").pop();
      const key = imageKey(fname.replace(/\.[^.]+$/, ""));
      if (names.has(key)) dups.push(`${names.get(key)} ↔ ${fname}`);   // 공백/대소문자만 다른 같은 이름
      names.set(key, fname);
      try{
        const raw = await f.async("uint8array");
        thumbs.set(key, await makeImageBlob(raw, fname));              // 겹치면 뒤의 것 사용 (PC와 동일)
      }catch(e){ fail++; console.warn("이미지 변환 실패:", fname, e); }
    }
    const entries = [...thumbs];
    await idbReplaceAll(entries);
    imgMeta = { version: info.version, count: entries.length, size: Number(info.size) || zipBlob.size, savedAt: Date.now() };
    lsSet(LS.imgMeta, imgMeta);
    setImgUrls(new Map(entries));
    render();
    toast(`이미지 ${entries.length}장 저장 완료` + (fail ? ` (${fail}장 실패)` : ""));
    if (dups.length) dialog({ title: "이름이 겹치는 이미지", msg: "다음 이미지는 이름이 같아(공백·대소문자 무시) 뒤의 것만 사용됩니다:\n- " + dups.join("\n- "), buttons: [["확인", null, "pri"]] });
  }catch(e){
    console.warn(e);
    toast("이미지 받기 실패: " + errText(e));
    imgProgress = "실패: " + errText(e);
    imgBusy = false; updateImgInfo(); return;
  }
  imgBusy = false; imgProgress = ""; updateImgInfo();
}

function diffText(compareVal, mainVal){
  if (compareVal === 0 || mainVal === 0) return ["비교가격없음(0원)", "muted"];
  const d = compareVal - mainVal;
  if (d > 0) return [`${comma(d)}원 높음 ▲`, "higher"];
  if (d < 0) return [`${comma(-d)}원 낮음 ▼`, "lower"];
  return ["동일", "same"];
}
function cardHtml(it, mainItem){
  const isCmp = !!mainItem;
  let disc = 0, rate = "0.0%";
  if (it.n !== 0 && it.r !== 0){ disc = it.n - it.r; rate = (disc / it.n * 100).toFixed(1) + "%"; }
  const nd = isCmp ? diffText(it.n, mainItem.n) : null;
  const rd = isCmp ? diffText(it.r, mainItem.r) : null;
  const link = productUrl(it);
  const img = imgMode !== "off" ? imgUrls.get(imageKey(it.model)) : null;
  return `<div class="card${isCmp ? " c" : ""}">
    <div class="chead">
      ${img ? `<img class="thumb" src="${img}" alt="" loading="lazy" data-model="${esc(it.model)}">` : ""}
      <div class="txt">
        <div class="model">${isCmp ? "<small>⚖ 비교</small>" : ""}${esc(it.model)}</div>
        <div class="desc">${esc(it.desc)}</div>
      </div>
    </div>
    <div class="prices">
      <div class="p"><div class="l">일반판매가</div><div class="v">${comma(it.n)} 원</div>${nd ? `<div class="d ${nd[1]}">${nd[0]}</div>` : ""}</div>
      <div class="p rw"><div class="l">보상판매가</div><div class="v">${comma(it.r)} 원</div>${rd ? `<div class="d ${rd[1]}">${rd[0]}</div>` : ""}</div>
      <div class="p"><div class="l">할인된가격</div><div class="v">${comma(disc)} 원</div></div>
      <div class="p"><div class="l">할인율</div><div class="v">${rate}</div></div>
    </div>
    <div class="meta">
      ${it.box ? `<span>${esc(it.box)}</span>` : ""}
      ${it.memo ? `<span class="memo">${esc(it.memo)}</span>` : ""}
      <span class="cacts">
        ${link ? `<a class="b3d link" href="${esc(link)}" target="_blank" rel="noopener">🔗 상세</a>` : ""}
        <button class="b3d grn add" data-add="${esc(it.model)}">＋ 담기</button>
      </span>
    </div>
  </div>`;
}

function render(){
  saveSearch();
  const out = $("out");
  if (!items.length){
    if (updating) out.innerHTML = emptyHtml("가격표를 받는 중…");
    else if (syncing) out.innerHTML = emptyHtml("확인 중…");
    else if (syncErr) out.innerHTML = emptyHtml(`가격표를 받지 못했습니다<br><small>${esc(syncErr.reason)}${retryTimer ? " · 자동으로 다시 시도 중" : ""}</small><br><button class="b3d pri" data-retry="1">다시 받기</button>`);
    else if (pendingUpd && pendingUpd.data) out.innerHTML = emptyHtml(`가격표가 없습니다${pendingUpd.data.size ? `<br><small>약 ${sizeText(pendingUpd.data.size)}</small>` : ""}<br><button class="b3d pri" data-upd="1">가격표 받기</button>`);
    else out.innerHTML = emptyHtml("데이터가 없습니다<br>☁ 데이터 받기 버튼을 눌러 주세요");
    return;
  }
  const mainTerm = $("qA").value.trim();
  const cmpTerm = mode === "cmp" ? $("qB").value.trim() : "";
  if (!normalizeQuery(mainTerm)){
    out.innerHTML = emptyHtml(`검색할 모델명 또는 설명을 입력해보세요.<br><small>상품 ${comma(items.length)}개</small>`);
    return;
  }
  const mainAll = searchAll(mainTerm);
  if (!mainAll.length){ out.innerHTML = emptyHtml(`'${esc(mainTerm)}' 일치하는 모델명 또는 제품설명이 없습니다.`); return; }
  const total = mainAll.length;
  const cmpAll = normalizeQuery(cmpTerm) ? searchAll(cmpTerm) : [];
  let header, cls = "count";
  if (cmpTerm){
    if (!cmpAll.length) header = `메인 ${total}건 발견 (비교 대상 '${esc(cmpTerm)}'은 일치 검색어 없음)`;
    else { header = `⚖ 비교중 (메인 ${total}건)`; cls += " cmp"; }
  } else {
    header = `검색 결과: 총 ${total}건` + (total > DISPLAY_LIMIT ? ` (상위 ${DISPLAY_LIMIT}건 표시)` : "");
  }
  const pool = cmpAll.length ? preparePool(cmpAll) : null;
  const html = [`<div class="${cls}">${header}</div>`];
  for (const m of mainAll.slice(0, DISPLAY_LIMIT)){
    html.push(cardHtml(m));
    if (pool) for (const c of smartMatch(m.model, pool)) html.push(cardHtml(c, m));
  }
  out.innerHTML = html.join("");
}

function setStatus(msg, err){ const s = $("status"); s.textContent = msg; s.classList.toggle("err", !!err); }
// 시간 표시: 오늘이면 "20:41", 다른 날이면 "10/13 20:41"
function whenText(ts){
  const d = new Date(ts), now = new Date(), z = n => String(n).padStart(2,"0");
  const t = `${z(d.getHours())}:${z(d.getMinutes())}`;
  return d.toDateString() === now.toDateString() ? t : `${d.getMonth()+1}/${d.getDate()} ${t}`;
}
// 상태줄: "2026.09.09 기준 · 275개 · 확인 20:41 최신"
// mode: (없음)=보통 / "warn"=빨간 글씨(확인은 됨) / "fail"=확인 실패
function showMetaStatus(extra, mode){
  if (!meta){ setStatus("데이터 없음", true); return; }
  let m = `${meta.dataDate ? meta.dataDate + " 기준 · " : ""}${comma(items.length)}개`;
  if (mode === "pend") m += ` · ${extra}`;   // 새 데이터 있음 (짧게 한 줄)
  else if (mode === "fail") m += ` · ${extra || "확인 실패"}` + (meta.checkedAt ? ` (${whenText(meta.checkedAt)})` : "");
  else m += ` · 확인 ${whenText(meta.checkedAt || meta.syncedAt)}` + (extra ? " " + extra : "");
  setStatus(m, mode === "warn" || mode === "fail" || mode === "pend");
}
function markChecked(){ if (meta){ meta.checkedAt = Date.now(); saveDataCache(); } }
function saveDataCache(){
  const slim = items.map(({key, ...rest}) => rest);
  lsSet(LS.data, { items: slim, meta });
}
function applyData(parsed, extraMeta){
  items = parsed.items; indexItems();
  const now = Date.now();
  meta = Object.assign({ dataDate: parsed.dataDate, syncedAt: now, checkedAt: now }, extraMeta);
  saveDataCache();
  render(); showMetaStatus("새 가격표 적용");
  refreshCartPrices();
}

function loadCache(){

// 드라이브 요청 (시간 제한 포함: 신호가 약해 응답이 없으면 무한정 기다리지 않음)
function timeoutErr(){ const e = new Error("응답 시간 초과 (신호가 약하거나 연결이 끊겼습니다)"); e.kind = "timeout"; return e; }
async function driveRequest(url, read, ms){
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), ms);
  try{
    const r = await fetch(url, { cache:"no-store", signal: ctl.signal });
    if (!r.ok){
      let reason = "";
      try{ const j = await r.json(); reason = (j.error && j.error.message) || ""; }catch(e){}
      const err = new Error(`드라이브 오류 ${r.status}${reason ? ": " + reason : ""}`);
      err.status = r.status; err.reason = reason;
      throw err;
    }
    return await read(r, ctl, timer);
  }catch(e){
    if (e && e.name === "AbortError") throw timeoutErr();
    throw e;
  }finally{ clearTimeout(timer); }
}
// 일시적인 오류면 1.5초 뒤 한 번 더 (시간 초과는 이미 오래 기다렸으므로 제외)
async function driveRequestRetry(url, read, ms){
  try{ return await driveRequest(url, read, ms); }
  catch(e){
    if (!navigator.onLine || e.kind === "timeout" || !isRetryable(e)) throw e;
    await new Promise(r => setTimeout(r, 1500));
    return driveRequest(url, read, ms);
  }
}
// 오류 → 쉬운 설명 + 다시 시도할 만한지
function errInfo(e){
  const st = e && e.status, rs = String((e && e.reason) || "");
  if (!navigator.onLine) return { reason: "인터넷 연결 없음", retry: false };   // 연결되면 자동 확인
  if (e && e.kind === "timeout") return { reason: "응답 없음 (신호 약함)", retry: true };
  if (st >= 500) return { reason: "구글 서버 일시 오류", retry: true };
  if (st === 429 || (st === 403 && /rate|quota|limit/i.test(rs))) return { reason: "요청이 많아 잠시 제한됨", retry: true };
  if (st === 404) return { reason: "파일을 찾을 수 없음 (관리자 확인 필요)", retry: false };
  if (st === 403 || st === 400) return { reason: "접근 거부 (관리자 확인 필요)", retry: false };
  if (e instanceof TypeError) return { reason: "연결 실패", retry: true };
  return { reason: (e && e.message) || "알 수 없는 오류", retry: false };
}
function isRetryable(e){ return errInfo(e).retry; }
// 인터넷·드라이브 오류는 쉬운 문구로, 그 밖의 오류(파일 내용 문제 등)는 원래 문구 그대로
function errText(e){
  const net = !navigator.onLine || (e && (e.status || e.kind === "timeout")) || e instanceof TypeError;
  return net ? errInfo(e).reason : ((e && e.message) || "알 수 없는 오류");
}
const driveJson   = url => driveRequestRetry(url, r => r.json(), 15000);          // 파일 정보 (15초)
const driveBuffer = url => driveRequestRetry(url, r => r.arrayBuffer(), 30000);   // 가격표 엑셀 (30초)

/* ---------- 실패 시 자동 재시도: 10초 → 30초 → 1분, 그 뒤엔 원래대로 5분마다 ---------- */
const RETRY_DELAYS = [10000, 30000, 60000];
let syncErr = null, retryStep = 0, retryTimer = null;
function clearRetry(){ if (retryTimer){ clearTimeout(retryTimer); retryTimer = null; } }
function syncOk(){ syncErr = null; retryStep = 0; clearRetry(); $("status").classList.remove("tap"); }
function syncFail(e){
  const info = errInfo(e);
  syncErr = info; clearRetry();
  if (info.retry && retryStep < RETRY_DELAYS.length){
    retryTimer = setTimeout(() => { retryTimer = null; if (!document.hidden) sync(false); }, RETRY_DELAYS[retryStep++]);
  }
  const tail = retryTimer ? "재시도 중" : "눌러서 재시도";
  if (items.length) showMetaStatus(`${info.reason} · ${tail}`, "fail");
  else setStatus(`${info.reason} · ${tail}`, true);
  $("status").classList.add("tap");
  if (!items.length) render();
}
// 빨간 글씨(또는 빈 화면의 [다시 받기])를 누르면 바로 다시 시도
async function retryNow(){
  if (syncing){ toast("확인 중입니다"); return; }
  retryStep = 0; clearRetry();
  await sync(false);
  toast(syncErr ? "다시 실패: " + syncErr.reason : "확인했습니다");
}
$("status").addEventListener("click", () => {
  if (!$("status").classList.contains("tap")) return;
  if (syncErr) retryNow(); else if (pendingUpd) askUpdate();
});
$("out").addEventListener("click", ev => {
  if (ev.target.closest("[data-retry]")) retryNow();
  else if (ev.target.closest("[data-upd]")){ if (pendingUpd) askUpdate(); else sync(true); }
});
// 버전 확인 (가벼움) → 새 버전이 있으면 팝업으로 안내 (자동으로 받지 않음)
// manual: ☁·승인 직후처럼 사용자가 직접 확인한 경우 → [나중에]를 눌렀던 버전도 다시 묻고, 결과를 알림
async function sync(manual){
  if (syncing || updating){ if (manual) toast("확인 중입니다. 잠시 후 다시 눌러 주세요"); return; }
  if (!(await checkAuth())){ checkAppUpdate(); return; }   // 승인되지 않은 기기는 확인하지 않음
  if (syncing || updating) return;
  syncing = true; lastCheck = Date.now();
  $("btnSync").disabled = true;
  $("status").classList.remove("tap");
  if (imgProgress && !imgBusy){ imgProgress = ""; updateImgInfo(); }   // 지난번 이미지 실패 문구 지우기
  let ok = false;
  try{
    if (!items.length){ setStatus("확인 중…"); render(); }
    else if (manual) setStatus("변경 확인 중…");
    const dv = await getDataVersion();
    let im = null;
    try{ im = await getImageInfo(); }                 // 이미지 '끔'이어도 크기 확인 (안내문용)
    catch(e){ if (imgMode === "on") throw e; }
    const needData = !items.length || !meta || meta.source !== "drive" || meta.dataVersion !== dv;
    const needImg = imgMode === "on" && !!im && (!imgMeta || !imgMeta.count || imgMeta.version !== im.version);
    pendingUpd = (needData || needImg) ? {
      data: needData ? { from: (meta && meta.dataVersion) || "", to: dv, size: await getDataSize(dv) } : null,
      img: needImg ? { from: (imgMeta && imgMeta.count && imgMeta.version) || "", to: im.version, size: im.size } : null,
    } : null;
    markChecked(); syncOk(); ok = true;
    if (items.length) showMetaStatus(pendingUpd ? "" : "최신"); else setStatus(pendingUpd ? "" : "데이터 없음", !pendingUpd);
  }catch(e){
    console.warn(e);
    syncing = false;
    syncFail(e);
    if (manual) toast("확인 실패: " + syncErr.reason);
  }finally{
    syncing = false; $("btnSync").disabled = false;
  }
  if (ok){
    showPendingState();
    if (pendingUpd && (manual || updKey(pendingUpd) !== dismissedKey)) await askUpdate();
    else if (!pendingUpd && manual) toast("변경된 data가 없습니다 (최신 상태)");
  }
  if (!items.length) render();
  checkAppUpdate();
}

// 가격표 엑셀 크기 (버전이 바뀔 때만 다시 확인)
const LS_DATASIZE = "rps_data_size";

function updKey(u){ return u ? `${u.data ? u.data.to : ""}|${u.img ? u.img.to : ""}` : ""; }

// 업데이트 안내 팝업: 무엇이 바뀌었는지 + 용량 → [업데이트]를 눌러야 받음
async function askUpdate(){

        + "\n\n" + (total && lines.length > 1 ? `합계 약 ${sizeText(total)} · ` : "") + "모바일 데이터 사용 시 요금이 발생할 수 있습니다.",
      buttons: [["나중에", null], ["업데이트", "ok", "pri"]] });

    if (!go){ setDismissed(updKey(u)); toast("나중에 ☁ 버튼으로 받을 수 있습니다"); }

async function applyUpdate(u){
  if (updating) return;
  updating = true; $("btnSync").disabled = true;

    if (u.data) await downloadData(u.data.to);
    if (u.img && imgMode === "on") await downloadImages({ version: u.img.to, size: u.img.size });
  }finally{ updating = false; $("btnSync").disabled = false; }
  // 받지 못한 것(실패·적용 안 함)만 남김 → 이번 실행 동안은 다시 묻지 않음 (☁로 다시 받기)
  const leftData = u.data && !(meta && meta.dataVersion === u.data.to) ? u.data : null;
  const leftImg = u.img && imgMode === "on" && !(imgMeta && imgMeta.count && imgMeta.version === u.img.to) ? u.img : null;
  pendingUpd = (leftData || leftImg) ? { data: leftData, img: leftImg } : null;
  if (pendingUpd) setDismissed(updKey(pendingUpd));
  else if (items.length) showMetaStatus("최신");

}
async function downloadData(ver){

    if (!(await confirmShrink(parsed))){ if (items.length) showMetaStatus(); toast("새 가격표를 적용하지 않았습니다"); return false; }
    applyData(parsed, { dataVersion: ver, source: "drive" });

    if (items.length) showMetaStatus(); else setStatus("가격표 받기 실패: " + errText(e), true);

  }
}

/* =========================================================
   뒤로가기 처리: 열린 창을 기록해 두고 뒤로가기 시 위에서부터 닫음
   ========================================================= */
const layers = [];   // 열린 순서: "sheet" | "cart" | "admin" | "share" | "viewer"
const LAYER_EL = { sheet: "sheet", cart: "cartSheet", admin: "adminSheet", share: "shareSheet" };
function hideLayer(name){
  if (name === "viewer") $("viewer").hidden = true;
  else $(LAYER_EL[name] || "sheet").classList.remove("show");
  if (!Object.values(LAYER_EL).some(id => $(id).classList.contains("show"))) $("mask").classList.remove("show");
}
function pushLayer(name){
  layers.push(name);
  try{ history.pushState({ rpsDepth: layers.length }, ""); }catch(e){}
}
function closeLayers(n){   // 위에서부터 n개 닫기 (뒤로가기와 같은 방식)
  n = Math.min(n, layers.length);
  if (n <= 0) return;
  try{ history.go(-n); }
  catch(e){ for (let i = 0; i < n; i++) hideLayer(layers.pop()); }
}
let ignorePop = 0, popWaiter = null;   // 코드가 직접 되돌린 기록은 무시
window.addEventListener("popstate", ev => {
  if (ignorePop > 0){
    ignorePop--;
    if (popWaiter){ const w = popWaiter; popWaiter = null; w(); }
    return;
  }
  if (dlgEntry){ dlgEntry = false; if (dlgCancel) dlgCancel(true); return; }   // 대화상자가 떠 있으면 그것만 닫음
  const depth = (ev.state && ev.state.rpsDepth) || 0;
  while (layers.length > depth) hideLayer(layers.pop());
});
// 버튼으로 대화상자를 닫을 때: 대화상자용 기록 1개를 조용히 되돌림
function historyBackQuiet(){
  return new Promise(res => {
    ignorePop++; popWaiter = res;
    try{ history.back(); }catch(e){ ignorePop--; popWaiter = null; res(); return; }
    setTimeout(() => { if (popWaiter === res){ popWaiter = null; if (ignorePop > 0) ignorePop--; res(); } }, 600);
  });
}
// 새로고침/업데이트 직후: 이전 화면에서 남은 창 기록을 정리 (뒤로가기 한 번에 종료되도록)
(function rewindHistory(){
  try{
    const st = history.state;
    const n = st ? (st.rpsDepth || 0) + (st.dlg ? 1 : 0) : 0;
    if (n > 0){ ignorePop++; history.go(-n); }
  }catch(e){}
})();

const MAX_QTY = 999;

const LS_CART = "rps_cart", LS_QUOTES = "rps_quotes";

function saveCart(){ lsSet(LS_CART, cart); }
function unitPrice(e){ const it = byModel.get(e.model); if (!it) return 0; return e.type === "reward" ? it.r : it.n; }
function cartQty(){ return cart.entries.reduce((s, e) => s + e.qty, 0); }
function cartTotal(){
  if (!cart.entries.length) return 0;

  if (cart.ship) s += SHIPPING_FEE;

  saveCart(); updateCartBadge(); renderCart();

function buildQuoteText(){
  if (!cart.entries.length) return null;

function setQty(i, q){
  if (q <= 0) cart.entries.splice(i, 1);
  else cart.entries[i].qty = Math.min(MAX_QTY, q);
  if (!cart.entries.length) cart.loadedName = null;
  saveCart(); renderCart();
}
$("cartList").addEventListener("click", async ev => {
  const b = ev.target.closest("[data-act]"); if (!b) return;
  const i = +b.dataset.i, e = cart.entries[i]; if (!e) return;
  const act = b.dataset.act;
  if (act === "inc") setQty(i, e.qty + 1);
  else if (act === "dec") setQty(i, e.qty - 1);
  else if (act === "del") setQty(i, 0);
  else if (act === "type"){ e.type = b.dataset.v; saveCart(); renderCart(); }
  else if (act === "qty"){
    const v = await dialog({ title: "수량 입력", msg: e.model, input: { value: String(e.qty), numeric: true }, buttons: [["취소", null], ["확인", "ok", "pri"]] });
    if (v && v.btn === "ok"){ const n = parseInt(v.value, 10); if (!isNaN(n)) setQty(i, n); }
  }
});
$("chkShip").onchange = () => { cart.ship = $("chkShip").checked; saveCart(); renderCart(); };

// 보내기 / 복사
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }
  catch(e){
    try{ const ta = document.createElement("textarea"); ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select(); const ok = document.execCommand("copy"); ta.remove(); return ok; }
    catch(e2){ return false; }
  }
}
function quoteOrToast(){
  if (!cart.entries.length){ toast("견적함이 비어 있습니다"); return null; }
  if (!items.length){ toast("가격표가 없어 견적을 만들 수 없습니다 (☁ 데이터 받기)"); return null; }
  return buildQuoteText();
}
$("btnCopy").onclick = async () => {
  const t = quoteOrToast();
  if (!t) return;
  toast(await copyText(t) ? "견적을 복사했습니다" : "복사 실패");
};
$("btnShare").onclick = async () => {
  const t = quoteOrToast();
  if (!t) return;
  if (navigator.share){
    try{ await navigator.share({ text: t }); }
    catch(e){ if (e && e.name !== "AbortError"){ if (await copyText(t)) toast("공유가 안 되어 복사했습니다"); } }
  } else {
    toast(await copyText(t) ? "공유를 지원하지 않아 복사했습니다" : "복사 실패");
  }
};

// 저장 / 불러오기 (모델명·수량·가격유형만 저장 → 불러올 때 최신 가격으로 다시 계산)
function getQuotes(){ const q = lsGet(LS_QUOTES); return q && typeof q === "object" ? q : {}; }
function nowText(){ const d = new Date(), z = n => String(n).padStart(2,"0"); return `${d.getFullYear()}.${z(d.getMonth()+1)}.${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}`; }
function sanitizeName(n){ return String(n || "").trim().replace(/[\\/:*?"<>|]/g, "_").replace(/^[ .]+|[ .]+$/g, "").slice(0, 50); }
function entriesFromItems(list){
  const entries = [], missing = [];
  for (const x of list || []){
    if (!x || typeof x !== "object") continue;
    const it = byModel.get(x.model_name);
    if (!it){ missing.push(x.model_name || "(알 수 없음)"); continue; }
    let qty = parseInt(x.qty, 10); if (isNaN(qty)) qty = 1;
    if (qty <= 0) continue;
    let type = x.price_type === "normal" ? "normal" : "reward";
    if (type === "reward" && it.r === 0 && it.n !== 0) type = "normal";        // 가격이 없어졌으면 있는 쪽으로
    else if (type === "normal" && it.n === 0 && it.r !== 0) type = "reward";
    entries.push({ model: x.model_name, qty: Math.min(qty, MAX_QTY), type });
  }
  return { entries, missing };
}
$("btnQSave").onclick = async () => {
  if (!cart.entries.length){ toast("저장할 견적함 내용이 없습니다"); return; }
  const r = await dialog({ title: "견적 저장", msg: "저장할 이름을 입력하세요 (예: 고객명)", input: { value: cart.loadedName || "" }, buttons: [["취소", null], ["저장", "ok", "pri"]] });
  if (!r || r.btn !== "ok") return;
  const name = sanitizeName(r.value);
  if (!name){ toast("이름을 입력하세요"); return; }
  const qs = getQuotes();
  if (qs[name]){
    const o = await dialog({ title: "덮어쓰기 확인", msg: `'${name}' 이름으로 이미 저장된 견적이 있습니다.\n덮어쓸까요?`, buttons: [["취소", null], ["덮어쓰기", "ok", "pri"]] });
    if (!o || o.btn !== "ok") return;
    delete qs[name];
  }
  qs[name] = { name, saved_at: nowText(), ship: !!cart.ship,
    items: cart.entries.map(e => ({ model_name: e.model, qty: e.qty, price_type: e.type })) };
  if (!lsSet(LS_QUOTES, qs)){ toast("저장 실패 (저장 공간 부족)"); return; }
  cart.loadedName = name; saveCart(); renderCart();
  toast(`'${name}' 저장 완료`);
};
$("btnQLoad").onclick = async () => {
  for (;;){
    const qs = getQuotes();
    const names = Object.keys(qs).sort((a, b) => String(qs[b].saved_at).localeCompare(String(qs[a].saved_at)));   // 최근 저장한 것이 위로
    if (!names.length){ toast("저장된 견적이 없습니다"); return; }
    const r = await dialog({ title: "견적 불러오기", list: names.map(n => ({ name: n, sub: `${qs[n].saved_at || ""} · ${(qs[n].items || []).length}개 제품` })), buttons: [["닫기", null]] });
    if (!r || !r.btn) return;
    if (r.btn === "del"){
      const c = await dialog({ title: "삭제 확인", msg: `'${r.name}' 저장 견적을 삭제할까요?`, buttons: [["취소", null], ["삭제", "ok", "pri"]] });
      if (c && c.btn === "ok"){ delete qs[r.name]; lsSet(LS_QUOTES, qs); }
      continue;
    }
    if (r.btn === "load"){
      if (cart.entries.length){
        const c = await dialog({ title: "불러오기 확인", msg: "현재 견적함 내용을 지우고 선택한 견적을 불러올까요?", buttons: [["취소", null], ["불러오기", "ok", "pri"]] });
        if (!c || c.btn !== "ok") continue;
      }
      const q = qs[r.name], { entries, missing } = entriesFromItems(q.items);
      cart = { entries, ship: !!q.ship, loadedName: entries.length ? r.name : null };
      saveCart(); renderCart();
      if (missing.length) await dialog({ title: "일부 상품 제외됨", msg: "다음 상품은 현재 가격표에 없어 견적에서 제외되었습니다 (최신 가격 기준):\n- " + missing.join("\n- "), buttons: [["확인", null, "pri"]] });
      else toast(`'${r.name}' 불러옴 (최신 가격 기준)`);
      return;
    }
  }
};

// 가격표가 새로 바뀌면: 견적함 가격은 자동으로 최신 가격, 없어진 상품은 빼고 알림
function refreshCartPrices(){
  if (!cart.entries.length){ renderCart(); return; }
  const { entries, missing } = entriesFromItems(cart.entries.map(e => ({ model_name: e.model, qty: e.qty, price_type: e.type })));
  cart.entries = entries; if (!entries.length) cart.loadedName = null;
  saveCart(); renderCart();
  if (missing.length) dialog({ title: "견적함 상품 제외", msg: "새 가격표에 없는 상품을 견적함에서 뺐습니다:\n- " + missing.join("\n- "), buttons: [["확인", null, "pri"]] });
}

// buttons: [[글자, 값, "pri"?], ...]  /  input: {value, numeric}  /  list: [{name, sub}]
let dlgQueue = Promise.resolve();
let dlgCancel = null;          // 열려 있는 대화상자를 '취소'로 닫는 함수 (뒤로가기용)
let dlgEntry = false;          // 대화상자용 뒤로가기 기록이 있는지
function dialog(o){
  const p = dlgQueue.then(() => showDialog(o));   // 앞의 창이 닫힌 뒤에 다음 창 표시
  dlgQueue = p.catch(() => {});
  return p;
}
function showDialog(o){
  return new Promise(resolve => {
    const d = $("dlg"), inp = $("dlgInput"), lst = $("dlgList"), acts = $("dlgActs");
    $("dlgTitle").textContent = o.title || "";
    $("dlgMsg").textContent = o.msg || ""; $("dlgMsg").hidden = !o.msg;
    inp.hidden = !o.input; lst.hidden = !o.list;
    if (o.input){ inp.value = o.input.value || ""; inp.inputMode = o.input.numeric ? "numeric" : "text"; inp.type = "text"; }
    let closed = false;
    const done = async (v, fromBack) => {
      if (closed) return; closed = true;
      d.hidden = true; d.onclick = null; inp.onkeydown = null; lst.onclick = null; dlgCancel = null;
      if (!fromBack && dlgEntry){ dlgEntry = false; await historyBackQuiet(); }   // 버튼으로 닫으면 기록도 정리
      resolve(v);
    };
    dlgCancel = fromBack => done(null, fromBack);
    if (o.list){
      lst.innerHTML = o.list.map((x, i) => `<div class="qitem"><div class="t"><b>${esc(x.name)}</b><small>${esc(x.sub)}</small></div>
        <button class="b3d pri" data-l="load" data-i="${i}">불러오기</button><button class="b3d red" data-l="del" data-i="${i}">🗑</button></div>`).join("");
      lst.onclick = ev => { const b = ev.target.closest("[data-l]"); if (b) done({ btn: b.dataset.l, name: o.list[+b.dataset.i].name }); };
    }
    acts.innerHTML = ""; acts.classList.toggle("col", !!o.stack);   // stack: 버튼을 세로로
    for (const [label, val, cls, href] of o.buttons || [["확인", null]]){
      // href가 있으면 링크 버튼 (아이폰 등에서 팝업 차단 없이 바로 열리도록 진짜 링크로 만듦)
      const b = document.createElement(href ? "a" : "button"); b.className = "b3d" + (cls ? " " + cls : ""); b.textContent = label;
      if (href){ b.href = href; b.target = "_blank"; b.rel = "noopener"; b.style.textAlign = "center"; b.style.textDecoration = "none"; }
      b.onclick = () => done({ btn: val, value: inp.value });
      acts.appendChild(b);
    }
    d.onclick = ev => { if (ev.target === d) done(null); };
    if (o.input) inp.onkeydown = ev => { if (ev.key === "Enter"){ const ok = (o.buttons || []).find(x => x[1] === "ok"); if (ok) done({ btn: "ok", value: inp.value }); } };
    d.hidden = false;
    try{ history.pushState({ rpsDepth: layers.length, dlg: true }, ""); dlgEntry = true; }catch(e){}   // 뒤로가기 = 취소
    if (o.input) setTimeout(() => { inp.focus(); inp.select(); }, 50);
  });
}


/* =========================================================
   사용 승인: 구글 시트 명단(기기번호 | 이름 | 허용)에 "O"로 등록된 기기만 사용
   - 확인: 앱을 열 때, 5분마다, 앱으로 돌아올 때, ☁ 누를 때
   - X로 바뀌거나 명단에서 빠지면 → 가격표·이미지·견적함·저장 견적 삭제 후 잠금
   - 명단을 확인하지 못하면(인터넷 끊김 등) 직전 상태 유지
   ========================================================= */
const LS_DEVICE = "rps_device", LS_AUTH = "rps_auth";
function makeDeviceId(){
  const A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";   // 헷갈리는 0/O, 1/I 제외
  const b = new Uint8Array(8);
  try{ crypto.getRandomValues(b); }catch(e){ for (let i = 0; i < 8; i++) b[i] = Math.floor(Math.random() * 256); }
  let s = "";
  for (let i = 0; i < 8; i++){ s += A[b[i] % A.length]; if (i === 3) s += "-"; }
  return s;
}
let DEVICE_ID = lsGetStr(LS_DEVICE, "");
if (!/^[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(DEVICE_ID)){ DEVICE_ID = makeDeviceId(); lsSetStr(LS_DEVICE, DEVICE_ID); }
let authState = lsGet(LS_AUTH) || { status: "pending" };   // ok | pending | blocked
let authChecking = null;

function normId(v){ return String(v || "").toUpperCase().replace(/[^A-Z0-9]/g, ""); }
function isAllowed(v){ return /^(o|ㅇ|y|yes|예|허용|승인|관리자)$/i.test(String(v || "").trim()); }
// 허용 칸이 비어 있어도 '대기'로 봄 (관리자 목록·직원 폰·대기 숫자 모두 같게)
function isWaiting(v){ const s = String(v || "").trim(); return s === "대기" || s === ""; }
const REQ_GRACE_MS = 3 * 60 * 1000;   // 요청 직후 시트 반영이 늦어도 3분 동안은 '요청 완료' 유지
function isAdminVal(v){ return String(v || "").trim() === "관리자"; }
// CSV 읽기 (따옴표·쉼표·줄바꿈 처리)
function parseCsv(t){
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < t.length; i++){
    const c = t[i];
    if (q){
      if (c === '"'){ if (t[i+1] === '"'){ cur += '"'; i++; } else q = false; }
      else cur += c;
    } else if (c === '"') q = true;
    else if (c === ","){ row.push(cur); cur = ""; }
    else if (c === "\n" || c === "\r"){ if (c === "\r" && t[i+1] === "\n") i++; row.push(cur); rows.push(row); row = []; cur = ""; }
    else cur += c;
  }
  if (cur !== "" || row.length){ row.push(cur); rows.push(row); }
  return rows;
}
async function fetchUserList(){
  const url = `https://www.googleapis.com/drive/v3/files/${USER_SHEET_ID}/export?mimeType=text%2Fcsv&key=${API_KEY}`;
  try{
    return parseCsv(await driveRequest(url, r => r.text(), 15000));
  }catch(e){
    // 예비 경로: 구글 시트 자체 CSV 주소 (드라이브 API가 막혔을 때)
    if (!navigator.onLine) throw e;
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 15000);
    try{
      const r = await fetch(`https://docs.google.com/spreadsheets/d/${USER_SHEET_ID}/gviz/tq?tqx=out:csv`, { cache: "no-store", signal: ctl.signal });
      if (!r.ok) throw e;
      return parseCsv(await r.text());
    }finally{ clearTimeout(t); }
  }
}
function setAuth(status, extra){
  authState = Object.assign({}, authState, { status, checkedAt: Date.now() }, extra || {});
  lsSet(LS_AUTH, authState);
}
// 차단 시: 이 폰에 저장된 가격 관련 데이터 모두 삭제
async function wipeAllData(){
  lsDel(LS.data); lsDel(LS.imgMeta); lsDel(LS_CART); lsDel(LS_QUOTES);
  lsDel(SS_SEARCH); lsDel(SS_SCROLL);
  try{ await idbClear(); }catch(e){}
  setImgUrls(new Map()); imgMeta = null; pendingUpd = null; setDismissed(""); $("syncDot").hidden = true;
  items = []; meta = null; indexItems();
  cart = { entries: [], ship: false, loadedName: null }; renderCart();
  for (const id of ["qA","qB"]){ $(id).value = ""; $(id).parentElement.classList.remove("has"); }
  render(); setStatus("데이터 없음", true);
}
function showLock(status, info){
  const blocked = status === "blocked";
  $("lock").classList.toggle("blocked", blocked);
  $("lockTitle").textContent = blocked ? "사용이 중지되었습니다" : "승인이 필요합니다";
  $("lockMsg").innerHTML = blocked
    ? "관리자에 의해 사용이 중지되어<br>저장된 가격표를 삭제했습니다.<br>다시 사용하려면 관리자에게 문의하세요."
    : "관리자에게 아래 기기번호를 보내<br>사용 승인을 받으세요.";
  $("lockId").textContent = DEVICE_ID;
  // 아이폰 사파리·카톡 안: 여기의 기기번호는 설치한 앱과 달라서 보내면 안 됨 → 숨기고 설치 안내만
  const gate = !blocked && mustInstallFirst();
  $("lockId").hidden = gate; $("btnSendId").hidden = gate; $("btnCopyId").hidden = gate;
  if (gate) $("lockMsg").innerHTML = "설치한 앱에서만 사용할 수 있습니다.";
  $("lockInfo").textContent = info || (authState.checkedAt ? `마지막 확인 ${whenText(authState.checkedAt)}` : "");
  const canRequest = !blocked && !!ADMIN_API_URL && !ADMIN_API_URL.startsWith("__");
  updateInstallBox(blocked);
  $("reqBox").hidden = !canRequest || !!authState.requested || mustInstallFirst();   // 아이폰·카톡 안에서는 설치 후 요청
  $("reqDone").hidden = !canRequest || !authState.requested;
  if (canRequest && authState.name && !$("reqName").value) $("reqName").value = authState.name;
  if (!blocked && authState.requested) startLockPolling(); else stopLockPolling();
  if ($("lock").hidden){
    closeSheet(); $("viewer").hidden = true;
    $("lock").hidden = false;
  }
}
function hideLock(){ $("lock").hidden = true; stopLockPolling(); }
// 승인 요청을 보낸 뒤에는 잠금 화면에서 30초마다 확인 (허용되면 바로 열림)
let lockPoll = null;
function startLockPolling(){
  if (lockPoll) return;
  lockPoll = setInterval(async () => {
    if (document.hidden || $("lock").hidden) return;
    if (await checkAuth()) sync(true);
  }, 30000);
}
function stopLockPolling(){ if (lockPoll){ clearInterval(lockPoll); lockPoll = null; } }

// 명단 확인 → 사용 가능하면 true
function checkAuth(){
  if (!authChecking) authChecking = doCheckAuth().finally(() => { authChecking = null; });
  return authChecking;
}
async function doCheckAuth(){
  let rows;
  try{ rows = await fetchUserList(); }
  catch(e){
    console.warn("사용자 명단 확인 실패", e);
    if (authState.status !== "ok"){
      showLock(authState.status, navigator.onLine ? "명단을 확인하지 못했습니다. 잠시 후 [다시 확인]을 눌러 주세요." : "인터넷 연결을 확인한 뒤 [다시 확인]을 눌러 주세요.");
    }
    return authState.status === "ok";   // 확인 못하면 직전 상태 유지 (오프라인 잠금 없음)
  }
  const me = normId(DEVICE_ID);
  const row = rows.find(r => normId(r[0]) === me);
  const prev = authState.status;
  if (row && isAllowed(row[2])){
    const role = isAdminVal(row[2]) ? "admin" : "user";
    setAuth("ok", { name: String(row[1] || "").trim(), role, requested: false });
    if (role === "admin") updateAdminBadge(rows); else updateAdminBadge(null);
    if (prev !== "ok"){ hideLock(); toast("사용이 승인되었습니다"); }
    return true;
  }
  // 허용이 아님: 예전에 승인됐었거나 X로 등록돼 있으면 '차단', 아직 등록 전(또는 '대기')이면 '승인 대기'
  const waiting = !!row && isWaiting(row[2]);
  const status = (prev === "ok" || prev === "blocked" || (row && !waiting)) ? "blocked" : "pending";
  if (status === "blocked") await wipeAllData();
  // 방금 요청했는데 시트에 아직 안 보이면(반영 지연) 요청 완료 상태 유지
  const justRequested = !row && status === "pending" && authState.requested && authState.requestedAt && (Date.now() - authState.requestedAt < REQ_GRACE_MS);
  setAuth(status, { role: "user", requested: waiting || !!justRequested });
  updateAdminBadge(null);
  showLock(status);
  return false;
}


/* =========================================================
   승인 요청 / 관리자 메뉴 (구글 Apps Script를 통해 명단 시트를 수정)
   - 직원: 잠금 화면에서 이름 입력 → [승인 요청] → 시트에 "대기"로 추가
   - 관리자(시트 허용 칸 = "관리자"인 기기): ⚙ → [사용자 관리] → 비밀번호 6자리
   ========================================================= */
let adminPin = null;          // 저장하지 않고 메모리에만 기억
let adminPinAt = 0;           // 마지막으로 비밀번호를 쓴 시간
const PIN_KEEP_MS = 10 * 60 * 1000;   // 10분 동안 안 쓰면 다시 물음
let adminUsers = [];
async function adminApi(body){
  if (!ADMIN_API_URL || ADMIN_API_URL.startsWith("__")) throw new Error("관리자 기능 주소가 설정되지 않았습니다");
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 20000);
  try{
    const r = await fetch(ADMIN_API_URL, { method: "POST", body: JSON.stringify(Object.assign({ deviceId: DEVICE_ID }, body)), signal: ctl.signal });
    const j = await r.json();
    if (!j.ok){
      let msg = j.error || "요청 실패";
      if (msg === "알 수 없는 요청") msg = "Apps Script를 새 버전으로 다시 배포해 주세요";
      const err = new Error(msg); err.badPin = !!j.badPin;
      if (j.exists) err.data = j;          // 이미 등록된 기기 (추가할 때)
      throw err;
    }
    return j;
  }catch(e){
    if (e && e.name === "AbortError") throw timeoutErr();
    if (e instanceof TypeError) throw new Error(navigator.onLine ? "관리 서버에 연결하지 못했습니다" : "인터넷 연결을 확인하세요");
    throw e;
  }finally{ clearTimeout(t); }
}

// 직원: 승인 요청
$("btnRequest").onclick = async () => {
  const name = $("reqName").value.trim();
  if (!name){ toast("이름을 입력하세요"); $("reqName").focus(); return; }
  const b = $("btnRequest"); b.disabled = true; b.textContent = "보내는 중…";
  try{
    const j = await adminApi({ action: "request", name });
    setAuth(authState.status, { requested: j.status === "대기", requestedAt: Date.now(), name });
    if (j.status === "대기") toast("승인 요청을 보냈습니다");
    if (await checkAuth()) sync(true); else showLock(authState.status);
  }catch(e){ toast(e.message); }
  finally{ b.disabled = false; b.textContent = "승인 요청"; }
};
$("reqName").addEventListener("keydown", e => { if (e.key === "Enter") $("btnRequest").click(); });

// 관리자: 대기 중인 요청 수를 ⚙ 버튼과 [사용자 관리]에 표시
function updateAdminBadge(rows){
  const isAdmin = authState.status === "ok" && authState.role === "admin";
  $("admSec").hidden = !isAdmin;
  const n = isAdmin && rows ? rows.filter(r => normId(r[0]) && isWaiting(r[2])).length : 0;
  $("setBadge").hidden = !n; $("setBadge").textContent = n;
  $("btnAdmin").textContent = n ? `사용자 관리 (대기 ${n})` : "사용자 관리";
}

async function askPin(){
  if (adminPin && Date.now() - adminPinAt < PIN_KEEP_MS) return adminPin;
  adminPin = null;
  const r = await dialog({ title: "관리자 비밀번호", msg: "6자리 숫자를 입력하세요", input: { value: "", numeric: true }, buttons: [["취소", null], ["확인", "ok", "pri"]] });
  if (!r || r.btn !== "ok") return null;
  const v = String(r.value || "").trim();
  if (!/^\d{6}$/.test(v)){ toast("6자리 숫자를 입력하세요"); return null; }
  return v;
}
// 비밀번호가 필요한 관리자 요청 (틀리면 다시 묻기)
// firstPin: 방금 입력받은 비밀번호 (맞다고 확인된 뒤에만 기억)
// quiet=true: 서버가 거절한 결과(예: 이미 등록된 기기)는 호출한 곳에서 처리하도록 그대로 돌려줌
async function adminCall(body, firstPin, quiet){
  let pin = firstPin || null;
  for (let tries = 0; tries < 3; tries++){
    if (!pin) pin = await askPin();
    if (!pin) return null;
    try{
      const j = await adminApi(Object.assign({ pin }, body));
      adminPin = pin; adminPinAt = Date.now();
      return j;
    }catch(e){
      if (e.badPin){ adminPin = null; pin = null; toast(e.message); continue; }
      if (quiet && e.data){ adminPin = pin; adminPinAt = Date.now(); return e.data; }
      toast(e.message); return null;
    }
  }
  return null;
}

const ST_INFO = { "O": ["허용","ok"], "X": ["차단","no"], "대기": ["대기","wait"], "관리자": ["관리자","boss"] };   // ("adm"은 창 이름과 겹쳐서 사용 안 함)
function statusOf(v){
  const s = String(v || "").trim();
  if (isAdminVal(s)) return ST_INFO["관리자"];
  if (isWaiting(s) || s === "") return ST_INFO["대기"];
  return isAllowed(s) ? ST_INFO["O"] : ST_INFO["X"];
}
// 같은 이름 확인 (띄어쓰기·대소문자 무시)
function nameKey(n){ return String(n || "").replace(/\s+/g, "").toLowerCase(); }
function sameNameOthers(id, name){
  const k = nameKey(name); if (!k) return [];
  return adminUsers.filter(x => x.id !== id && nameKey(x.name) === k);
}
// 허용 전에 같은 이름 기기가 있으면 물어봄 → null: 취소 / { remove: [삭제할 기존 기기] }
async function askSameName(id, name){
  const others = sameNameOthers(id, name);
  if (!others.length) return { remove: [] };
  const canReplace = !others.some(x => statusOf(x.status)[1] === "boss");   // 관리자 기기는 삭제 대상에서 제외
  const lines = others.map(x => `· ${x.id} · ${statusOf(x.status)[0]}${x.time ? " · " + x.time : ""}`).join("\n");
  const msg = `${String(name).trim()}\n${lines}\n\n새 기기: ${id}`
    + (canReplace ? "\n\n폰을 바꿨다면 기존 기기를 삭제하세요.\n(기존 기기는 사용 중지·데이터 삭제)" : "");
  const buttons = canReplace
    ? [["기존 기기 삭제 후 허용", "replace", "pri"], ["둘 다 사용", "both"], ["취소", null]]
    : [["취소", null], ["둘 다 사용", "both", "pri"]];
  const r = await dialog({ title: "같은 이름의 기기가 있습니다", msg, buttons, stack: canReplace });
  if (!r || !r.btn) return null;
  return { remove: r.btn === "replace" ? others : [] };
}
async function removeDevices(list){
  let n = 0;
  for (const x of list){ if (await adminCall({ action: "delete", id: x.id })) n++; }
  return n;
}
function renderAdminList(){
  const order = { wait: 0, ok: 1, boss: 2, no: 3 };
  const list = adminUsers.slice().sort((a, b) => order[statusOf(a.status)[1]] - order[statusOf(b.status)[1]]);
  if (!list.length){ $("admList").innerHTML = `<div class="cempty">등록된 사용자가 없습니다</div>`; return; }
  const cnt = new Map();   // 같은 이름 기기 수 (띄어쓰기·대소문자 무시)
  for (const u of list){ const k = nameKey(u.name); if (k) cnt.set(k, (cnt.get(k) || 0) + 1); }
  $("admList").innerHTML = list.map(u => {
    const [label, cls] = statusOf(u.status);
    const same = cnt.get(nameKey(u.name)) || 0;
    const me = normId(u.id) === normId(DEVICE_ID);
    let btns = "";
    if (cls === "wait") btns = `<button class="b3d grn" data-a="O" data-id="${esc(u.id)}">허용</button><button class="b3d red" data-a="X" data-id="${esc(u.id)}">거절</button>`;
    else if (cls === "ok") btns = `<button class="b3d red" data-a="X" data-id="${esc(u.id)}">차단</button>`;
    else if (cls === "no") btns = `<button class="b3d grn" data-a="O" data-id="${esc(u.id)}">허용</button>`;
    if (cls !== "boss") btns += `<button class="b3d" data-a="del" data-id="${esc(u.id)}">삭제</button>`;
    return `<div class="urow">
      <div class="u1"><div class="nm">${esc(u.name || "(이름 없음)")}${me ? " (이 폰)" : ""}</div>${same > 1 ? `<span class="st same">같은 이름 ${same}대</span>` : ""}<span class="st ${cls}">${label}</span></div>
      <div class="id">${esc(u.id)}${u.time ? " · " + esc(u.time) : ""}</div>
      ${btns ? `<div class="u2">${btns}</div>` : ""}
    </div>`;
  }).join("");
}
async function loadAdminList(firstPin){
  $("admList").innerHTML = `<div class="cempty">불러오는 중…</div>`;
  const j = await adminCall({ action: "list" }, typeof firstPin === "string" ? firstPin : null);
  if (!j){ $("admList").innerHTML = `<div class="cempty">불러오지 못했습니다</div>`; return false; }
  adminUsers = j.users || [];
  renderAdminList();
  updateAdminBadge(adminUsers.map(u => [u.id, u.name, u.status]));
  return true;
}
async function openAdmin(){
  if (!(authState.status === "ok" && authState.role === "admin")) return;
  const pin = await askPin();          // 창을 열기 전에 비밀번호부터 입력 (맞는지는 목록을 받으며 확인)
  if (!pin) return;
  $("mask").classList.add("show"); $("adminSheet").classList.add("show");
  pushLayer("admin");
  if (!(await loadAdminList(pin)) && !adminPin) closeLayers(1);
}
$("btnAdmin").onclick = openAdmin;
$("btnAdmClose").onclick = () => closeLayers(1);
$("btnAdmRefresh").onclick = () => loadAdminList();
$("admList").addEventListener("click", async ev => {
  const b = ev.target.closest("[data-a]"); if (!b) return;
  const id = b.dataset.id, act = b.dataset.a;
  const u = adminUsers.find(x => x.id === id) || { name: "" };
  const who = `${u.name || "(이름 없음)"} (${id})`;
  if (act === "X" || act === "del"){
    const msg = act === "X" ? `${who}\n\n차단하면 그 폰의 가격표·이미지·견적이 삭제됩니다.\n차단할까요?`
                            : `${who}\n\n명단에서 삭제할까요?\n(삭제해도 차단과 같이 그 폰의 데이터가 삭제됩니다)`;
    const r = await dialog({ title: act === "X" ? "차단" : "삭제", msg, buttons: [["취소", null], [act === "X" ? "차단" : "삭제", "ok", "pri"]] });
    if (!r || r.btn !== "ok") return;
  }
  let plan = null;
  if (act === "O"){ plan = await askSameName(id, u.name); if (!plan) return; }
  b.disabled = true;
  const j = await adminCall(act === "del" ? { action: "delete", id } : { action: "set", id, status: act });
  if (j){
    const n = plan && plan.remove.length ? await removeDevices(plan.remove) : 0;
    toast(act === "O" ? (n ? `허용했습니다 (기존 기기 ${n}대 삭제)` : "허용했습니다") : act === "X" ? "차단했습니다" : "삭제했습니다");
    await loadAdminList();
  }
  else b.disabled = false;
});
$("btnAdmAdd").onclick = async () => {
  const r1 = await dialog({ title: "사용자 추가", msg: "기기번호를 입력하세요 (예: K7P2-9XMQ)", input: { value: "" }, buttons: [["취소", null], ["다음", "ok", "pri"]] });
  if (!r1 || r1.btn !== "ok") return;
  const raw = normId(r1.value);
  if (raw.length !== 8){ toast("기기번호는 영문·숫자 8자리입니다"); return; }
  if (/[01OI]/.test(raw)){
    await dialog({ title: "기기번호 확인", msg: "기기번호에는 숫자 0·1, 영문 O·I가 없습니다.\n직원 폰 화면의 번호를 다시 확인해 주세요.", buttons: [["확인", "ok", "pri"]] });
    return;
  }
  const id = raw.slice(0, 4) + "-" + raw.slice(4);
  const r2 = await dialog({ title: "사용자 추가", msg: `${id}\n이름을 입력하세요`, input: { value: "" }, buttons: [["취소", null], ["허용으로 추가", "ok", "pri"]] });
  if (!r2 || r2.btn !== "ok") return;
  const name = String(r2.value || "").trim();
  const cur = adminUsers.find(x => x.id === id);
  const plan = await askSameName(id, name || (cur ? cur.name : ""));   // 같은 이름 기기 확인
  if (!plan) return;
  const finish = async msg => {
    const n = plan.remove.length ? await removeDevices(plan.remove) : 0;
    toast(n ? `${msg} (기존 기기 ${n}대 삭제)` : msg); await loadAdminList();
  };
  let j = await adminCall({ action: "add", id, name }, null, true);
  if (j && j.exists){
    // 이미 명단에 있는 기기: 확인 후 허용으로 변경 (이름을 비웠으면 기존 이름 유지)
    const u = j.user || {};
    const [label, cls] = statusOf(u.status);
    if (cls === "boss"){ toast("관리자 기기는 시트에서 직접 변경하세요"); return; }
    const r3 = await dialog({ title: "이미 등록된 기기", msg: `${id}\n${u.name || "(이름 없음)"} · ${label}\n\n허용으로 바꿀까요?${name && name !== u.name ? `\n(이름: ${u.name || "없음"} → ${name})` : ""}`, buttons: [["취소", null], ["허용", "ok", "pri"]] });
    if (!r3 || r3.btn !== "ok") return;
    j = await adminCall({ action: "add", id, name, overwrite: true });
    if (j) await finish("허용했습니다");
    return;
  }
  if (j) await finish("추가했습니다");
};

const APP_URL = new URL("./", location.href).href;   // 예: https://mr-joon.github.io/price/
const SHARE_TEXT = `[판매가 검색기] 설치 안내
${APP_URL}

1) 링크 열기 (안드로이드: 크롬 / 아이폰: 사파리)
2) 홈 화면에 추가
 · 안드로이드: ⋮ 메뉴 → 홈 화면에 추가
 · 아이폰: 공유 버튼 → 홈 화면에 추가
3) 앱 실행 → 이름 입력 → [승인 요청]`;

function openShare(){
  if (!(authState.status === "ok" && authState.role === "admin")) return;
  $("shrUrl").textContent = APP_URL;
  if (!$("qrImg").src){
    try{
      const q = qrcode(0, "M"); q.addData(APP_URL); q.make();
      $("qrImg").src = q.createDataURL(8, 2);
    }catch(e){ $("qrImg").closest(".qrbox").hidden = true; }
  }
  $("mask").classList.add("show"); $("shareSheet").classList.add("show");
  pushLayer("share");
}
$("btnShareApp").onclick = openShare;
$("btnShrClose").onclick = () => closeLayers(1);
$("btnShrSend").onclick = async () => {
  if (navigator.share){
    try{ await navigator.share({ text: SHARE_TEXT }); return; }
    catch(e){ if (e && e.name === "AbortError") return; }
  }
  toast(await copyText(SHARE_TEXT) ? "안내문을 복사했습니다" : "복사 실패");
};
$("btnShrCopy").onclick = async () => { toast(await copyText(APP_URL) ? "링크를 복사했습니다" : "복사 실패"); };

// 설치 상태 확인
const UA = navigator.userAgent || "";
const IS_IOS = /iPad|iPhone|iPod/.test(UA) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const IN_APP = /KAKAOTALK|NAVER\(inapp|Line\/|Instagram|FBAN|FBAV|DaumApps|BAND\//i.test(UA);   // 카톡 등 앱 안의 브라우저
const IS_KAKAO = /KAKAOTALK/i.test(UA);
function isStandalone(){
  try{ if (matchMedia("(display-mode: standalone)").matches) return true; }catch(e){}
  return navigator.standalone === true;
}
// 아이폰·앱 안 브라우저는 설치한 앱과 저장 공간이 달라 기기번호가 바뀜 → 설치 후 요청
function mustInstallFirst(){ return !isStandalone() && (IS_IOS || IN_APP); }
let installEvt = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; updateInstallBox(); });
window.addEventListener("appinstalled", () => { installEvt = null; updateInstallBox(); toast("설치했습니다. 홈 화면의 앱으로 열어 주세요"); });
function updateInstallBox(blocked){
  if (blocked === undefined) blocked = $("lock").classList.contains("blocked");
  const box = $("instBox");
  if (isStandalone() || blocked){ box.hidden = true; return; }
  let msg, inst = false, ext = false;
  if (IN_APP){
    msg = IS_IOS ? "앱 안에서는 설치할 수 없습니다\n<b>Safari로 열어</b> 홈 화면에 추가해 주세요"
                 : "앱 안에서는 설치할 수 없습니다\n<b>크롬으로 열어</b> 설치해 주세요";
    ext = IS_KAKAO;
  } else if (installEvt){
    msg = "<b>먼저 앱을 설치해 주세요</b>"; inst = true;
  } else if (IS_IOS){
    msg = "<b>먼저 홈 화면에 추가해 주세요</b>\n공유 버튼(□↑) → 홈 화면에 추가\n추가한 앱을 열고 승인 요청을 하세요";
  } else {
    msg = "<b>홈 화면에 추가하면 앱처럼 쓸 수 있습니다</b>\n크롬 ⋮ 메뉴 → 홈 화면에 추가";
  }
  $("instMsg").innerHTML = msg;
  $("btnInstall").hidden = !inst; $("btnOpenExt").hidden = !ext;
  box.hidden = false;
  if (!$("lock").hidden && !blocked) $("reqBox").hidden = !!authState.requested || mustInstallFirst() || !ADMIN_API_URL || ADMIN_API_URL.startsWith("__");
}
$("btnInstall").onclick = async () => {
  if (!installEvt) return;
  const e = installEvt; installEvt = null;
  try{ await e.prompt(); await e.userChoice; }catch(err){}
  updateInstallBox();
};
$("btnOpenExt").onclick = () => { location.href = "kakaotalk://web/openExternal?url=" + encodeURIComponent(APP_URL); };
