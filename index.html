<html lang="ko">
<head>
<meta charset="utf-8">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="판매가검색기">

<title>판매가 검색기 v1.0.6</title>

</script>
<style>
/* ===== 색상: 라이트 기본 / 다크는 [설정] 또는 폰 설정(자동)을 따름 ===== */
:root{
  --bg:#eef2f8; --card:#ffffff; --text:#1b2433; --sub:#6b7688; --line:#dde3ec;
  --brand:#1f5fbf; --brand-d:#174a96; --reward:#d9480f; --ok:#2b8a3e; --warn:#c92a2a;
  --cmp:#7048e8; --cmp-d:#5235b8; --cmp-bg:#f3f0ff; --cmp-line:#d0bfff;
  --btn:#f6f8fb; --btn-d:#c9d1dd; --chip:#e7eefb; --thumb:#ffffff;
  --green:#2f9e44; --green-d:#237a34;
}
:root[data-theme="dark"]{
  --bg:#11161f; --card:#1b2230; --text:#e7ecf4; --sub:#93a0b4; --line:#2b3446;
  --brand:#4d8cf0; --brand-d:#2f63b8; --reward:#ff8a4c; --ok:#5cc275; --warn:#ff6b6b;
  --cmp:#b197fc; --cmp-d:#7a5fd0; --cmp-bg:#231d38; --cmp-line:#4b3d7a;
  --btn:#263043; --btn-d:#0c1018; --chip:#22314b; --thumb:#f4f6f9; --green:#37b24d; --green-d:#1f7a30;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11161f; --card:#1b2230; --text:#e7ecf4; --sub:#93a0b4; --line:#2b3446;
    --brand:#4d8cf0; --brand-d:#2f63b8; --reward:#ff8a4c; --ok:#5cc275; --warn:#ff6b6b;
    --cmp:#b197fc; --cmp-d:#7a5fd0; --cmp-bg:#231d38; --cmp-line:#4b3d7a;
    --btn:#263043; --btn-d:#0c1018; --chip:#22314b; --thumb:#f4f6f9; --green:#37b24d; --green-d:#1f7a30;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
body{padding-bottom:env(safe-area-inset-bottom)}

/* ===== 상단 고정 영역 ===== */
.top{position:sticky;top:0;z-index:10;background:var(--bg);
  padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;border-bottom:1px solid var(--line)}
.head{display:flex;align-items:center;gap:8px}
.title{font-size:18px;font-weight:800;color:var(--brand);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ver{font-size:11px;font-weight:600;color:var(--sub);margin-left:4px}
.titleBox{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:3px}
.titleBox .title{flex:none;max-width:100%}
.logo{display:block;height:20px;width:auto;max-width:100%;object-fit:contain;cursor:pointer}
.status{font-size:12px;color:var(--sub);margin:6px 0 8px;min-height:16px}
.status.err{color:var(--warn);font-weight:600}

/* ===== 3D 버튼 ===== */
.b3d{border:none;border-radius:10px;background:var(--btn);color:var(--text);
  font-size:15px;font-weight:700;padding:9px 12px;cursor:pointer;
  box-shadow:0 3px 0 var(--btn-d),0 4px 8px rgba(0,0,0,.12);
  transition:transform .05s,box-shadow .05s;font-family:inherit}
.b3d:active{transform:translateY(3px);box-shadow:0 0 0 var(--btn-d),0 1px 3px rgba(0,0,0,.15)}
.b3d:disabled{opacity:.5}
.b3d.pri,.b3d.on{background:var(--brand);color:#fff;box-shadow:0 3px 0 var(--brand-d),0 4px 8px rgba(0,0,0,.18)}
.b3d.pri:active,.b3d.on:active{box-shadow:0 0 0 var(--brand-d)}
.icon{width:40px;height:40px;padding:0;font-size:19px;display:grid;place-items:center;flex:none}
.b3d.grn{background:var(--green);color:#fff;box-shadow:0 3px 0 var(--green-d),0 4px 8px rgba(0,0,0,.18)}
.b3d.grn:active{box-shadow:0 0 0 var(--green-d)}
.b3d.red{color:var(--warn)}
.cartBtn{position:relative}
.badge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;
  background:var(--warn);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;border:2px solid var(--bg)}

/* ===== 모드 탭 ===== */
.tabs{display:grid;grid-template-columns:1fr 1fr 44px;gap:8px;margin-bottom:10px}
.tabs .icon{width:44px;height:auto;min-height:40px}
.ico{width:22px;height:22px;display:block}

/* ===== 검색창 ===== */
.srow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.sbox{position:relative;flex:1}
.sbox input{width:100%;font-size:17px;padding:12px 42px 12px 14px;border-radius:12px;
  border:2px solid var(--line);background:var(--card);color:var(--text);outline:none;font-family:inherit}
.sbox input:focus{border-color:var(--brand)}
.sbox.c input:focus{border-color:var(--cmp)}
.sbox input::-webkit-search-cancel-button,.sbox input::-webkit-search-decoration{-webkit-appearance:none;appearance:none;display:none}
.sbox .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:none;
  background:var(--line);color:var(--sub);width:26px;height:26px;border-radius:50%;
  font-size:14px;display:none;cursor:pointer}
.sbox.has .clr{display:block}
.sbox .tag{position:absolute;left:-2px;top:-8px;font-size:10px;font-weight:800;color:#fff;
  background:var(--brand);border-radius:6px;padding:1px 6px}
.sbox .tag.c{background:var(--cmp)}

/* ===== 결과 ===== */
main{padding:10px 14px 30px}
.count{font-size:13px;color:var(--sub);margin:2px 2px 10px;font-weight:700}
.count.cmp{color:var(--cmp)}
.empty{text-align:center;color:var(--sub);padding:50px 10px;font-size:15px;line-height:1.7}
.card{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:10px;
  box-shadow:0 1px 3px rgba(0,0,0,.08);border:1px solid var(--line)}
.card.c{background:var(--cmp-bg);border-color:var(--cmp-line);margin-left:14px;border-left:4px solid var(--cmp)}
.chead{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
.chead .txt{flex:1;min-width:0}
.thumb{width:76px;height:76px;flex:none;border-radius:10px;background:var(--thumb);
  object-fit:contain;padding:3px;border:1px solid var(--line);cursor:zoom-in}
.model{font-size:18px;font-weight:800;word-break:break-all}
.card.c .model{font-size:16px;color:var(--cmp)}
.card.c .model small{font-size:11px;font-weight:700;margin-right:4px}
.desc{font-size:13px;color:var(--sub);margin-top:3px;line-height:1.4}
.prices{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.p{background:var(--bg);border-radius:9px;padding:6px 8px}
.card.c .p{background:var(--card)}
.p .l{font-size:11px;color:var(--sub)}
.p .v{font-size:15px;font-weight:800;margin-top:1px}
.p .d{font-size:11px;font-weight:700;margin-top:2px}
.p.rw .v{color:var(--reward)}
.d.higher{color:var(--warn)} .d.lower{color:var(--ok)} .d.same,.d.muted{color:var(--sub)}
.meta{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--sub);flex-wrap:wrap}
.memo{background:var(--chip);border-radius:6px;padding:2px 7px;color:var(--text)}
.link{margin-left:auto;color:var(--brand);font-weight:700;text-decoration:none;font-size:13px}
.nolink{margin-left:auto}
.add{font-size:13px;padding:6px 10px}

/* ===== 견적함 ===== */
.cart{display:flex;flex-direction:column;max-height:88vh;padding-bottom:calc(14px + env(safe-area-inset-bottom))}
.cart .chd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cart .chd h3{flex:1;margin:0}
.cart .loaded{font-size:12px;color:var(--sub);font-weight:600}
.clist{flex:1;overflow:auto;margin:0 -16px;padding:0 16px;min-height:60px}
.crow{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--bg)}
.crow .r1{display:flex;align-items:center;gap:8px}
.crow .nm{flex:1;font-weight:800;font-size:16px;word-break:break-all}
.crow .del{width:34px;height:34px;font-size:15px;padding:0}
.crow .r2{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.tg{display:flex;gap:6px}
.tg .b3d{font-size:13px;padding:6px 10px}
.unit{font-size:14px;font-weight:700;margin-left:auto}
.qty{display:flex;align-items:center;gap:6px}
.qty .b3d{width:34px;height:34px;padding:0;font-size:18px}
.qty .n{min-width:44px;text-align:center;font-size:16px;font-weight:800;border:1.5px solid var(--line);border-radius:8px;padding:5px 4px;background:var(--card);cursor:pointer}
.sub{margin-left:auto;font-size:15px;font-weight:800;color:var(--reward)}
.cfoot{border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
.ship{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700}
.ship input{width:22px;height:22px;accent-color:var(--brand)}
.tot{display:flex;align-items:baseline;justify-content:space-between;margin:8px 0 10px;font-weight:800}
.tot b{font-size:22px;color:var(--reward)}
.btn3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.btn2{display:grid;grid-template-columns:2fr 1fr;gap:8px}
.cempty{text-align:center;color:var(--sub);padding:30px 0;line-height:1.7}

/* ===== 대화상자 ===== */
.dlg{position:fixed;inset:0;z-index:65;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:20px}
.dlg .box{background:var(--card);color:var(--text);border-radius:16px;padding:18px 16px;width:100%;max-width:380px;max-height:80vh;display:flex;flex-direction:column}
.dlg h4{margin:0 0 8px;font-size:17px}
.dlg .msg{font-size:14px;line-height:1.6;white-space:pre-line;overflow:auto}
.dlg input{width:100%;font-size:16px;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--text);margin-top:10px;font-family:inherit}
.dlg .acts{display:grid;grid-auto-flow:column;gap:8px;margin-top:14px}
.qlist{overflow:auto;margin-top:6px}
.qitem{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.qitem .t{flex:1;min-width:0}
.qitem .t b{display:block;word-break:break-all}
.qitem .t small{color:var(--sub)}
.qitem .b3d{font-size:13px;padding:7px 10px}

/* ===== 이미지 크게 보기 ===== */
.viewer{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.75);display:grid;place-items:center;padding:24px}
.viewer img{max-width:100%;max-height:70vh;background:#fff;border-radius:14px;padding:10px}
.viewer div{color:#fff;font-weight:800;font-size:17px;margin-top:12px;text-align:center}

/* ===== 설정 시트 ===== */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none}
.mask.show{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--card);
  border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));
  transform:translateY(105%);transition:transform .2s;max-height:88vh;overflow:auto}
.sheet.show{transform:none}
.sheet h3{margin:0 0 4px;font-size:17px}
.sheet .sec{margin-top:16px}
.sheet .lab{font-size:13px;font-weight:800;margin-bottom:8px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg .b3d{font-size:14px;padding:9px 6px}
.sheet .hint{font-size:12px;color:var(--sub);line-height:1.5;margin-top:8px}
.sheet .hint.new{color:var(--reward);font-weight:700}
.sheet .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.sheet .full{width:100%;margin-top:18px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 60px);transform:translateX(-50%);
  background:#222b3a;color:#fff;font-size:14px;padding:10px 16px;border-radius:20px;z-index:80;
  opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:.95}
</style>
</head>

<script>
"use strict";
/* =========================================================
   판매가 검색기 (모바일 PWA)
   - 검색/비교/카드 규칙: PC 판매가검색기 v6.3.21과 동일
   - 데이터: 구글 드라이브 data.xlsx / 이미지 zip (Drive API v3 + API 키)
   - 오프라인: 데이터는 localStorage, 이미지는 IndexedDB에 저장
   ========================================================= */
const VERSION = "1.0.6";

// 구글 드라이브 접속 정보 (PC 앱 v6.3.21과 같은 파일)
const EXCEL_FILE_ID = "1KoHNrv5atci3MWEk2C2v3xUnqsLAZhzf";       // data.xlsx
const IMAGE_ZIP_ID  = "1sfNfJwTvrK8yAlYOOoB__tNHf21VbvG8";        // 제품 이미지 zip
const API_KEY       = "AIzaSyAMB2G_RWePWk0q0jddOmxscXNMeC3EuxM";  // mr-joon.github.io 전용 키

const CHECK_INTERVAL_MS = 5 * 60 * 1000;   // 5분마다 변경 확인
const DISPLAY_LIMIT = 100;                  // 검색 결과 표시 개수 상한 (PC와 동일)
const COMPARE_DISPLAY_LIMIT = 3;            // 메인 제품 1개당 비교 제품 수 (PC와 동일)
const SHIPPING_FEE = 4000;                  // 택배비 (PC와 동일)
const THUMB_MAX = 360;                      // 폰에 저장할 이미지 최대 크기(px)
const IMAGE_EXTS = ["png","gif","jpg","jpeg"];
const LS = { data:"rps_data2", theme:"rps_theme", imgMode:"rps_img_mode", imgMeta:"rps_img_meta" };

// 엑셀 열 번호 (0부터, PC와 동일)
const COL_MODEL = 1, COL_DESC = 2, COL_BOX = 3, COL_NORMAL = 4, COL_DATE = 5, COL_REWARD = 6, COL_URL = 8;

const $ = id => document.getElementById(id);
$("ver").textContent = " v" + VERSION;

/* ---------- 저장소 (실패해도 앱은 동작) ---------- */
function lsGet(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
function lsGetStr(k, def){ try{ return localStorage.getItem(k) || def; }catch(e){ return def; } }
function lsSetStr(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }

/* ---------- 상태 ---------- */
let items = [];          // 상품 목록
let meta = null;         // {dataDate, modifiedTime, syncedAt, source}
let mode = "all";        // all | cmp
let syncing = false;
let lastCheck = 0;
let byModel = new Map();   // 모델명 -> 상품 (견적함용)
const searchCache = new Map();

/* ---------- 유틸 ---------- */
function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove("show"), 2000);
}
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function hhmm(ts){ const d = new Date(ts), z = n => String(n).padStart(2,"0"); return `${d.getMonth()+1}/${d.getDate()} ${z(d.getHours())}:${z(d.getMinutes())}`; }
function text(v){ return v === null || v === undefined ? "" : String(v).trim(); }
function comma(n){ return Math.trunc(n).toLocaleString("ko-KR"); }
function mb(bytes){ return (bytes / 1048576).toFixed(1) + "MB"; }

/* =========================================================
   테마 (자동 / 라이트 / 다크)
   ========================================================= */
function applyTheme(v){
  if (v === "light" || v === "dark") document.documentElement.dataset.theme = v;
  else delete document.documentElement.dataset.theme;
  const bg = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
  $("metaTheme").setAttribute("content", bg || "#eef2f8");
  document.querySelectorAll("#segTheme .b3d").forEach(b => b.classList.toggle("on", b.dataset.v === v));
}
let themeMode = lsGetStr(LS.theme, "auto");
applyTheme(themeMode);
document.querySelectorAll("#segTheme .b3d").forEach(b => b.onclick = () => {
  themeMode = b.dataset.v; lsSetStr(LS.theme, themeMode); applyTheme(themeMode);
});
try{ matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => applyTheme(themeMode)); }catch(e){}

/* =========================================================
   가격 / 링크 / 검색 (PC v6.3.21 규칙)
   ========================================================= */
function parsePriceInt(v){
  const n = Number(String(v ?? "0").replace(/,/g,"").trim());
  return (String(v ?? "").trim() !== "" && isFinite(n)) ? Math.trunc(n) : 0;
}
function isSafeUrl(u){
  try{ const x = new URL(String(u).trim()); return (x.protocol==="http:"||x.protocol==="https:") && !!x.hostname; }
  catch(e){ return false; }
}
function buildProductUrl(model){
  const cleaned = String(model||"").replace(/\(.*?\)/g, "").trim();
  if (!cleaned) return null;
  const slug = cleaned.toLowerCase().replace(/ /g, "");
  return slug ? "https://hptkorea.co.kr/product/" + encodeURIComponent(slug) + "/" : null;
}
function productUrl(it){
  const u = it.customUrl || buildProductUrl(it.model);
  return u && isSafeUrl(u) ? u : null;
}
function makeSearchKey(model, desc){ return (model + desc).toLowerCase().replace(/ /g, ""); }
function normalizeQuery(t){ return (t || "").toLowerCase().replace(/ /g, ""); }
function tokenize(t){ return String(t).toLowerCase().match(/[가-힣]+|[a-z0-9]+/g) || []; }
function stripGen(name){ return String(name).replace(/\s*[\(（][^\)）]*[\)）]/g, "").trim(); }
function preparePool(list){ return list.map(it => [it, stripGen(it.model), new Set(tokenize(it.model))]); }
function smartMatch(mainName, pool, limit = COMPARE_DISPLAY_LIMIT){
  const mainBase = stripGen(mainName), mainTokens = tokenize(mainName);
  const scored = [];
  pool.forEach(([item, compBase, compTokens], idx) => {
    if (item.model === mainName) return;
    if (compBase && compBase === mainBase){ scored.push([9999, idx, item]); return; }
    let s = 0;
    for (const t of mainTokens) if (compTokens.has(t)) s += t.length;
    if (s > 0) scored.push([s, idx, item]);
  });
  scored.sort((a,b) => b[0]-a[0] || a[1]-b[1]);   // 점수 높은 순, 동점이면 원래 순서
  return scored.slice(0, limit).map(x => x[2]);
}
function searchAll(query){
  const q = normalizeQuery(query);
  if (!q) return [];
  if (searchCache.has(q)) return searchCache.get(q);
  const matched = items.filter(it => it.key.includes(q));
  if (searchCache.size >= 256) searchCache.clear();
  searchCache.set(q, matched);
  return matched;
}

/* ---------- 엑셀 → 상품목록 (PC: _read_excel) ---------- */
function dateText(v){
  if (v instanceof Date && !isNaN(v)) { const z=n=>String(n).padStart(2,"0"); return `${v.getFullYear()}-${z(v.getMonth()+1)}-${z(v.getDate())}`; }
  return text(v);
}
function customUrl(v){
  let s = text(v);
  if (!s || s.toLowerCase() === "none") return "";
  if (!isSafeUrl(s)) s = "http://" + s;
  if (!isSafeUrl(s) || /\s/.test(s)) return "";
  try{ if (!new URL(s).hostname.includes(".")) return ""; }catch(e){ return ""; }   // "단종" 같은 한 단어는 링크가 아니라 메모
  return s;
}
function parseWorkbook(buf){
  const wb = XLSX.read(buf, {type:"array", cellDates:true});
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:null, blankrows:true});
  let dataDate = "";
  const list = [];
  rows.forEach((row, idx) => {
    row = row || [];
    if (idx === 0 && row[COL_DATE] != null) dataDate = dateText(row[COL_DATE]);
    if (row.length < 7) return;
    const model = text(row[COL_MODEL]);
    if (!model || model.toLowerCase() === "none" || model === "모델명") return;   // 제목행 제외
    const memoRaw = text(row[COL_URL]);
    const cu = customUrl(row[COL_URL]);
    list.push({
      model, desc: text(row[COL_DESC]),
      box: text(row[COL_BOX]),
      n: parsePriceInt(row[COL_NORMAL]),
      r: parsePriceInt(row[COL_REWARD]),
      customUrl: cu,
      memo: (!cu && memoRaw && memoRaw.toLowerCase() !== "none") ? memoRaw : "",
    });
  });
  if (!list.length) throw new Error("상품 데이터가 비어 있습니다");
  return { items:list, dataDate };
}
function indexItems(){
  byModel = new Map();
  for (const it of items){ it.key = makeSearchKey(it.model, it.desc); byModel.set(it.model, it); }   // 모델명이 겹치면 나중 것 (PC와 동일)
  searchCache.clear();
}

/* =========================================================
   제품 이미지 (드라이브 zip → 썸네일 → IndexedDB)
   ========================================================= */
let imgMode = lsGetStr(LS.imgMode, "off");     // off | manual | auto
let imgMeta = lsGet(LS.imgMeta);                // {modifiedTime, count, size, savedAt}
let imgUrls = new Map();                        // 이미지키 -> blob URL
let imgBusy = false;
let imgPending = null;                          // 드라이브에 새 이미지가 있을 때 {modifiedTime, size}
let imgProgress = "";

// 모바일 데이터(또는 데이터 절약 모드)인지 확인 — 안드로이드 크롬에서만 알 수 있음, 모르면 false
function onCellular(){
  try{ const c = navigator.connection; return !!c && (c.type === "cellular" || !!c.saveData); }catch(e){ return false; }
}
function imageKey(name){ return String(name).replace(/ /g, "").toLowerCase(); }   // PC: 공백 제거 + 소문자

// IndexedDB 도우미
function idbOpen(){
  return new Promise((res, rej) => {
    const r = indexedDB.open("rps-images", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("img");
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function idbReplaceAll(entries){
  const db = await idbOpen();
  await new Promise((res, rej) => {
    const tx = db.transaction("img", "readwrite"), st = tx.objectStore("img");
    st.clear();
    for (const [k, blob] of entries) st.put(blob, k);
    tx.oncomplete = res; tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
  });
  db.close();
}
async function idbReadAll(){
  const db = await idbOpen();
  const out = await new Promise((res, rej) => {
    const tx = db.transaction("img", "readonly"), st = tx.objectStore("img");
    const map = new Map();
    const cur = st.openCursor();
    cur.onsuccess = () => { const c = cur.result; if (c){ map.set(c.key, c.value); c.continue(); } else res(map); };
    cur.onerror = () => rej(cur.error);
  });
  db.close();
  return out;
}
async function idbClear(){ try{ await idbReplaceAll([]); }catch(e){} }

function setImgUrls(map){
  for (const u of imgUrls.values()) URL.revokeObjectURL(u);
  imgUrls = new Map();
  for (const [k, blob] of map) imgUrls.set(k, URL.createObjectURL(blob));
}
async function loadImagesFromDb(){
  try{ setImgUrls(await idbReadAll()); }catch(e){ console.warn("이미지 불러오기 실패", e); }
}

// zip 안의 한글 파일명: UTF-8이 아니면 윈도우 한글(CP949)로 읽음
function decodeZipName(bytes){
  try{ return new TextDecoder("utf-8", {fatal:true}).decode(bytes); }
  catch(e){ try{ return new TextDecoder("euc-kr").decode(bytes); }catch(e2){ return String.fromCharCode(...bytes); } }
}

// 이미지 1장을 THUMB_MAX 안으로 줄여서 저장용 blob으로
const webpOk = (() => { try{ const c = document.createElement("canvas"); c.width = c.height = 1; return c.toDataURL("image/webp").startsWith("data:image/webp"); }catch(e){ return false; } })();
async function makeThumb(blob){
  const bmp = await createImageBitmap(blob);
  const scale = Math.min(1, THUMB_MAX / Math.max(bmp.width, bmp.height));
  const w = Math.max(1, Math.round(bmp.width * scale)), h = Math.max(1, Math.round(bmp.height * scale));
  const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
  cv.getContext("2d").drawImage(bmp, 0, 0, w, h);
  if (bmp.close) bmp.close();
  return await new Promise((res, rej) => cv.toBlob(b => b ? res(b) : rej(new Error("이미지 변환 실패")), webpOk ? "image/webp" : "image/png", 0.85));
}

// 다운로드 (진행률 표시)
async function fetchWithProgress(url, onProgress){
  const r = await driveFetch(url);
  const total = Number(r.headers.get("Content-Length")) || 0;
  if (!r.body || !r.body.getReader) return await r.arrayBuffer();
  const reader = r.body.getReader(), chunks = [];
  let got = 0;
  for (;;){
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value); got += value.length;
    onProgress(got, total);
  }
  const buf = new Uint8Array(got); let pos = 0;
  for (const c of chunks){ buf.set(c, pos); pos += c.length; }
  return buf.buffer;
}

function setImgProgress(msg){ imgProgress = msg; updateImgInfo(); }

async function getImageZipInfo(){
  const base = "https://www.googleapis.com/drive/v3/files/" + IMAGE_ZIP_ID;
  return await (await driveFetch(`${base}?fields=modifiedTime,size&supportsAllDrives=true&key=${API_KEY}`)).json();
}

async function downloadImages(info){
  if (imgBusy) return;
  imgBusy = true; updateImgInfo();
  try{
    if (!info) info = await getImageZipInfo();
    const base = "https://www.googleapis.com/drive/v3/files/" + IMAGE_ZIP_ID;
    const buf = await fetchWithProgress(`${base}?alt=media&supportsAllDrives=true&key=${API_KEY}`, (got, total) => {
      setImgProgress(total ? `받는 중 ${Math.floor(got / total * 100)}% (${mb(got)} / ${mb(total)})` : `받는 중 ${mb(got)}`);
    });
    setImgProgress("압축 푸는 중…");
    let zip;
    try{ zip = await JSZip.loadAsync(buf, { decodeFileName: decodeZipName }); }
    catch(e){ throw new Error("이미지 파일이 압축 파일(ZIP)이 아닙니다"); }
    const files = Object.values(zip.files).filter(f => {
      if (f.dir || f.name.includes("__MACOSX")) return false;
      const fname = f.name.replace(/\\/g, "/").split("/").pop();
      if (!fname || fname.startsWith("._")) return false;
      return IMAGE_EXTS.includes(fname.split(".").pop().toLowerCase());
    });
    if (!files.length) throw new Error("압축 파일 안에 이미지가 없습니다");
    const entries = [];
    let i = 0, fail = 0;
    for (const f of files){
      i++;
      if (i % 5 === 1) setImgProgress(`이미지 정리 중 ${i}/${files.length}`);
      const fname = f.name.replace(/\\/g, "/").split("/").pop();
      const key = imageKey(fname.replace(/\.[^.]+$/, ""));
      try{
        const raw = await f.async("blob");
        entries.push([key, await makeThumb(raw)]);
      }catch(e){ fail++; console.warn("이미지 변환 실패:", fname, e); }
    }
    await idbReplaceAll(entries);
    imgMeta = { modifiedTime: info.modifiedTime, count: entries.length, size: Number(info.size) || buf.byteLength, savedAt: Date.now() };
    lsSet(LS.imgMeta, imgMeta);
    imgPending = null;
    setImgUrls(new Map(entries));
    render();
    toast(`이미지 ${entries.length}장 저장 완료` + (fail ? ` (${fail}장 실패)` : ""));
  }catch(e){
    console.warn(e);
    toast(navigator.onLine ? "이미지 받기 실패" : "인터넷 연결을 확인하세요");
    imgProgress = "실패: " + e.message;
    imgBusy = false; updateImgInfo(); return;
  }
  imgBusy = false; imgProgress = ""; updateImgInfo();
}

// 데이터 확인할 때 같이 호출: 이미지가 바뀌었는지 확인
async function checkImages(){
  if (imgMode === "off" || imgBusy) return;
  try{
    const info = await getImageZipInfo();
    const changed = !imgMeta || !imgMeta.count || imgMeta.modifiedTime !== info.modifiedTime;
    if (!changed){ imgPending = null; updateImgInfo(); return; }
    if (imgMode === "auto" && !onCellular()) await downloadImages(info);
    else {
      const first = !imgPending;
      imgPending = info; updateImgInfo();
      if (first && imgMeta && imgMeta.count) toast("새 제품 이미지가 있습니다 (⚙ 설정)");
    }
  }catch(e){ console.warn("이미지 확인 실패", e); }
}

function updateImgInfo(){
  document.querySelectorAll("#segImg .b3d").forEach(b => b.classList.toggle("on", b.dataset.v === imgMode));
  const info = $("imgInfo");
  $("imgBtns").hidden = imgMode === "off";
  $("btnImgGet").disabled = imgBusy;
  $("btnImgDel").disabled = imgBusy || !(imgMeta && imgMeta.count);
  info.classList.remove("new");
  if (imgBusy || imgProgress){ info.textContent = imgProgress || "준비 중…"; return; }
  let s = imgMeta && imgMeta.count ? `저장된 이미지 ${imgMeta.count}장 · ${hhmm(imgMeta.savedAt)} 받음` : "저장된 이미지 없음";
  if (imgMode === "off") s += " · 표시 안 함";
  if (imgPending && imgMode !== "off"){
    s += ` · 새 이미지 있음${imgPending.size ? " (" + mb(Number(imgPending.size)) + ")" : ""}`;
    if (imgMode === "auto" && onCellular()) s += " · 와이파이 연결 시 자동으로 받음";
    info.classList.add("new");
  }
  info.textContent = s;
}
document.querySelectorAll("#segImg .b3d").forEach(b => b.onclick = () => {
  imgMode = b.dataset.v; lsSetStr(LS.imgMode, imgMode);
  updateImgInfo(); render();
  if (imgMode !== "off") checkImages();
});
$("btnImgGet").onclick = () => downloadImages(imgPending);
$("btnImgDel").onclick = async () => {
  await idbClear(); setImgUrls(new Map());
  imgMeta = null; lsDel(LS.imgMeta); imgPending = null;
  updateImgInfo(); render(); toast("이미지를 삭제했습니다");
};

/* =========================================================
   카드 / 결과 표시 (PC: ProductCard / run_search)
   ========================================================= */
function diffText(compareVal, mainVal){
  if (compareVal === 0 || mainVal === 0) return ["비교가격없음(0원)", "muted"];
  const d = compareVal - mainVal;
  if (d > 0) return [`${comma(d)}원 높음 ▲`, "higher"];
  if (d < 0) return [`${comma(-d)}원 낮음 ▼`, "lower"];
  return ["동일", "same"];
}
function cardHtml(it, mainItem){
  const isCmp = !!mainItem;
  let disc = 0, rate = "0.0%";
  if (it.n !== 0 && it.r !== 0){ disc = it.n - it.r; rate = (disc / it.n * 100).toFixed(1) + "%"; }
  const nd = isCmp ? diffText(it.n, mainItem.n) : null;
  const rd = isCmp ? diffText(it.r, mainItem.r) : null;
  const link = productUrl(it);
  const img = imgMode !== "off" ? imgUrls.get(imageKey(it.model)) : null;
  return `<div class="card${isCmp ? " c" : ""}">
    <div class="chead">
      ${img ? `<img class="thumb" src="${img}" alt="" loading="lazy" data-model="${esc(it.model)}">` : ""}
      <div class="txt">
        <div class="model">${isCmp ? "<small>⚖ 비교</small>" : ""}${esc(it.model)}</div>
        <div class="desc">${esc(it.desc)}</div>
      </div>
    </div>
    <div class="prices">
      <div class="p"><div class="l">일반판매가</div><div class="v">${comma(it.n)} 원</div>${nd ? `<div class="d ${nd[1]}">${nd[0]}</div>` : ""}</div>
      <div class="p rw"><div class="l">보상판매가</div><div class="v">${comma(it.r)} 원</div>${rd ? `<div class="d ${rd[1]}">${rd[0]}</div>` : ""}</div>
      <div class="p"><div class="l">할인된가격</div><div class="v">${comma(disc)} 원</div></div>
      <div class="p"><div class="l">할인율</div><div class="v">${rate}</div></div>
    </div>
    <div class="meta">
      ${it.box ? `<span>${esc(it.box)}</span>` : ""}
      ${it.memo ? `<span class="memo">${esc(it.memo)}</span>` : ""}
      ${link ? `<a class="link" href="${esc(link)}" target="_blank" rel="noopener">상세 ↗</a>` : `<span class="nolink">링크 없음</span>`}
      <button class="b3d grn add" data-add="${esc(it.model)}">＋ 담기</button>
    </div>
  </div>`;
}
function emptyHtml(msg){ return `<div class="empty">${msg}</div>`; }

function render(){
  const out = $("out");
  if (!items.length){ out.innerHTML = emptyHtml("데이터가 없습니다<br>☁ 데이터 받기 버튼을 눌러 주세요"); return; }
  const mainTerm = $("qA").value.trim();
  const cmpTerm = mode === "cmp" ? $("qB").value.trim() : "";
  if (!normalizeQuery(mainTerm)){
    out.innerHTML = emptyHtml(`검색할 모델명 또는 설명을 입력해보세요.<br><small>상품 ${comma(items.length)}개</small>`);
    return;
  }
  const mainAll = searchAll(mainTerm);
  if (!mainAll.length){ out.innerHTML = emptyHtml(`'${esc(mainTerm)}' 일치하는 모델명 또는 제품설명이 없습니다.`); return; }
  const total = mainAll.length;
  const cmpAll = normalizeQuery(cmpTerm) ? searchAll(cmpTerm) : [];
  let header, cls = "count";
  if (cmpTerm){
    if (!cmpAll.length) header = `메인 ${total}건 발견 (비교 대상 '${esc(cmpTerm)}'은 일치 검색어 없음)`;
    else { header = `⚖ 비교중 (메인 ${total}건)`; cls += " cmp"; }
  } else {
    header = `검색 결과: 총 ${total}건` + (total > DISPLAY_LIMIT ? ` (상위 ${DISPLAY_LIMIT}건 표시)` : "");
  }
  const pool = cmpAll.length ? preparePool(cmpAll) : null;
  const html = [`<div class="${cls}">${header}</div>`];
  for (const m of mainAll.slice(0, DISPLAY_LIMIT)){
    html.push(cardHtml(m));
    if (pool) for (const c of smartMatch(m.model, pool)) html.push(cardHtml(c, m));
  }
  out.innerHTML = html.join("");
}

function setStatus(msg, err){ const s = $("status"); s.textContent = msg; s.classList.toggle("err", !!err); }
function showMetaStatus(extra, err){
  if (!meta){ setStatus("데이터 없음", true); return; }
  let m = `${meta.dataDate ? meta.dataDate + " 기준 · " : ""}${comma(items.length)}개 · ${hhmm(meta.syncedAt)} 갱신`;
  if (meta.source === "file") m += " (폰 파일)";
  if (extra) m += " · " + extra;
  setStatus(m, err);
}
function applyData(parsed, extraMeta){
  items = parsed.items; indexItems();
  meta = Object.assign({ dataDate: parsed.dataDate, syncedAt: Date.now() }, extraMeta);
  const slim = items.map(({key, ...rest}) => rest);
  lsSet(LS.data, { items: slim, meta });
  render(); showMetaStatus();

function loadCache(){

async function driveFetch(url){
  const r = await fetch(url, { cache:"no-store" });
  if (!r.ok){
    let reason = "";
    try{ const j = await r.json(); reason = (j.error && j.error.message) || ""; }catch(e){}
    throw new Error(`드라이브 오류 ${r.status}${reason ? ": " + reason : ""}`);
  }
  return r;
}
async function sync(force){
  if (syncing) return;
  syncing = true; lastCheck = Date.now();
  $("btnSync").disabled = true;
  const base = "https://www.googleapis.com/drive/v3/files/" + EXCEL_FILE_ID;
  try{

    // 1) 변경 여부만 먼저 확인 (가벼움)
    const info = await (await driveFetch(`${base}?fields=modifiedTime&supportsAllDrives=true&key=${API_KEY}`)).json();
    if (!force && meta && meta.source === "drive" && meta.modifiedTime === info.modifiedTime && items.length){
      showMetaStatus("최신");
    } else {
      // 2) 바뀌었으면 다운로드
      setStatus("새 데이터 받는 중…");
      const buf = await (await driveFetch(`${base}?alt=media&supportsAllDrives=true&key=${API_KEY}`)).arrayBuffer();
      applyData(parseWorkbook(buf), { modifiedTime: info.modifiedTime, source:"drive" });
      if (force) toast("최신 데이터로 갱신했습니다");
    }
  }catch(e){
    console.warn(e);
    const offline = !navigator.onLine;
    if (items.length) showMetaStatus(offline ? "오프라인" : "갱신 실패", true);
    else setStatus((offline ? "오프라인: " : "") + e.message, true);
    if (force) toast(offline ? "인터넷 연결을 확인하세요" : "갱신 실패");
  }finally{
    syncing = false; $("btnSync").disabled = false;
  }
  checkImages();
}

/* =========================================================
   뒤로가기 처리: 열린 창을 기록해 두고 뒤로가기 시 위에서부터 닫음
   ========================================================= */
const layers = [];   // 열린 순서: "sheet" | "cart" | "viewer"
function hideLayer(name){
  if (name === "viewer") $("viewer").hidden = true;
  else $(name === "cart" ? "cartSheet" : "sheet").classList.remove("show");
  if (!$("sheet").classList.contains("show") && !$("cartSheet").classList.contains("show")) $("mask").classList.remove("show");
}
function pushLayer(name){
  layers.push(name);
  try{ history.pushState({ rpsDepth: layers.length }, ""); }catch(e){}
}
function closeLayers(n){   // 위에서부터 n개 닫기 (뒤로가기와 같은 방식)
  n = Math.min(n, layers.length);
  if (n <= 0) return;
  try{ history.go(-n); }
  catch(e){ for (let i = 0; i < n; i++) hideLayer(layers.pop()); }
}
window.addEventListener("popstate", ev => {
  const depth = (ev.state && ev.state.rpsDepth) || 0;
  if (dlgCancel && depth < layers.length){   // 대화상자가 떠 있으면 그것만 닫고 아래 창은 유지
    dlgCancel();
    try{ history.pushState({ rpsDepth: layers.length }, ""); }catch(e){}
    return;
  }
  while (layers.length > depth) hideLayer(layers.pop());
});

const MAX_QTY = 999;
const BANK_LINE = "국민은행: 24530104437426 (한일공구)";   // 견적 마지막 줄 (PC와 동일)
const LS_CART = "rps_cart", LS_QUOTES = "rps_quotes";
// cart.entries: [{model, qty, type:"reward"|"normal"}] (담은 순서 유지)
let cart = lsGet(LS_CART) || { entries: [], ship: false, loadedName: null };
if (!Array.isArray(cart.entries)) cart = { entries: [], ship: false, loadedName: null };

function saveCart(){ lsSet(LS_CART, cart); }
function unitPrice(e){ const it = byModel.get(e.model); if (!it) return 0; return e.type === "reward" ? it.r : it.n; }
function cartQty(){ return cart.entries.reduce((s, e) => s + e.qty, 0); }
function cartTotal(){
  if (!cart.entries.length) return 0;
  let s = cart.entries.reduce((a, e) => a + unitPrice(e) * e.qty, 0);
  if (cart.ship) s += SHIPPING_FEE;
  return s;
}
function updateCartBadge(){
  const q = cartQty(), b = $("cartBadge");
  b.textContent = q > 999 ? "999+" : q; b.hidden = q === 0;
  $("btnCart").classList.toggle("grn", q > 0);
}
function addToCart(model){
  const it = byModel.get(model); if (!it) return;
  const e = cart.entries.find(x => x.model === model);
  if (e) e.qty = Math.min(MAX_QTY, e.qty + 1);
  else cart.entries.push({ model, qty: 1, type: it.r !== 0 ? "reward" : "normal" });   // 보상가 있으면 보상가로
  saveCart(); updateCartBadge(); renderCart();
  toast(`${model} 담음 (${e ? e.qty : 1}개)`);
}
function buildQuoteText(){
  if (!cart.entries.length) return null;
  const lines = ["[HPT 견적 안내]\n"];
  let total = 0, idx = 1;
  for (const e of cart.entries){
    const unit = unitPrice(e), sub = unit * e.qty;
    total += sub;
    lines.push(`${idx}. ${e.model} (${e.type === "reward" ? "보상" : "일반"})`);
    lines.push(`   - 단가: ${comma(unit)}원 x ${e.qty}개`);
    lines.push(`   - 소계: ${comma(sub)}원\n`);
    idx++;
  }
  if (cart.ship){ lines.push(`${idx}. 배송비: ${comma(SHIPPING_FEE)}원`); total += SHIPPING_FEE; }
  else lines.push(`${idx}. 배송비: 0원`);
  lines.push("-".repeat(30));
  lines.push(`최종 결제 금액: ${comma(total)}원\n`);
  lines.push(BANK_LINE);
  return lines.join("\n");
}
function renderCart(){
  updateCartBadge();
  $("cartName").textContent = cart.loadedName ? `(${cart.loadedName})` : "";
  $("chkShip").checked = !!cart.ship;
  $("cartTotal").textContent = comma(cartTotal()) + " 원";
  const list = $("cartList");
  if (!cart.entries.length){ list.innerHTML = `<div class="cempty">견적함이 비어 있습니다<br><small>검색 결과에서 ＋ 담기를 누르세요</small></div>`; return; }
  list.innerHTML = cart.entries.map((e, i) => {
    const it = byModel.get(e.model), unit = unitPrice(e);
    const rOk = it && it.r !== 0, nOk = it && it.n !== 0;
    return `<div class="crow">
      <div class="r1"><div class="nm">${esc(e.model)}</div><button class="b3d del red" data-act="del" data-i="${i}">🗑</button></div>
      <div class="r2">
        <div class="tg">
          <button class="b3d ${e.type==="reward"?"on":""}" data-act="type" data-v="reward" data-i="${i}" ${rOk?"":"disabled"}>보상</button>
          <button class="b3d ${e.type==="normal"?"on":""}" data-act="type" data-v="normal" data-i="${i}" ${nOk?"":"disabled"}>일반</button>
        </div>
        <div class="unit">${comma(unit)}원</div>
      </div>
      <div class="r2">
        <div class="qty">
          <button class="b3d" data-act="dec" data-i="${i}">－</button>
          <div class="n" data-act="qty" data-i="${i}">${e.qty}</div>
          <button class="b3d" data-act="inc" data-i="${i}">＋</button>
        </div>
        <div class="sub">${comma(unit * e.qty)}원</div>
      </div>
    </div>`;
  }).join("");
}
function setQty(i, q){
  if (q <= 0) cart.entries.splice(i, 1);
  else cart.entries[i].qty = Math.min(MAX_QTY, q);
  if (!cart.entries.length) cart.loadedName = null;
  saveCart(); renderCart();
}
$("cartList").addEventListener("click", async ev => {
  const b = ev.target.closest("[data-act]"); if (!b) return;
  const i = +b.dataset.i, e = cart.entries[i]; if (!e) return;
  const act = b.dataset.act;
  if (act === "inc") setQty(i, e.qty + 1);
  else if (act === "dec") setQty(i, e.qty - 1);
  else if (act === "del") setQty(i, 0);
  else if (act === "type"){ e.type = b.dataset.v; saveCart(); renderCart(); }
  else if (act === "qty"){
    const v = await dialog({ title: "수량 입력", msg: e.model, input: { value: String(e.qty), numeric: true }, buttons: [["취소", null], ["확인", "ok", "pri"]] });

// 저장 / 불러오기 (모델명·수량·가격유형만 저장 → 불러올 때 최신 가격으로 다시 계산)
function getQuotes(){ const q = lsGet(LS_QUOTES); return q && typeof q === "object" ? q : {}; }
function nowText(){ const d = new Date(), z = n => String(n).padStart(2,"0"); return `${d.getFullYear()}.${z(d.getMonth()+1)}.${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}`; }
function sanitizeName(n){ return String(n || "").trim().replace(/[\\/:*?"<>|]/g, "_").replace(/^[ .]+|[ .]+$/g, "").slice(0, 50); }
function entriesFromItems(list){
  const entries = [], missing = [];
  for (const x of list || []){
    if (!x || typeof x !== "object") continue;
    const it = byModel.get(x.model_name);
    if (!it){ missing.push(x.model_name || "(알 수 없음)"); continue; }
    let qty = parseInt(x.qty, 10); if (isNaN(qty)) qty = 1;
    if (qty <= 0) continue;
    let type = x.price_type === "normal" ? "normal" : "reward";
    if (type === "reward" && it.r === 0 && it.n !== 0) type = "normal";        // 가격이 없어졌으면 있는 쪽으로
    else if (type === "normal" && it.n === 0 && it.r !== 0) type = "reward";
    entries.push({ model: x.model_name, qty: Math.min(qty, MAX_QTY), type });
  }
  return { entries, missing };
}

    if (r.btn === "load"){
      if (cart.entries.length){
        const c = await dialog({ title: "불러오기 확인", msg: "현재 견적함 내용을 지우고 선택한 견적을 불러올까요?", buttons: [["취소", null], ["불러오기", "ok", "pri"]] });
        if (!c || c.btn !== "ok") continue;
      }
      const q = qs[r.name], { entries, missing } = entriesFromItems(q.items);
      cart = { entries, ship: !!q.ship, loadedName: entries.length ? r.name : null };
      saveCart(); renderCart();
      if (missing.length) await dialog({ title: "일부 상품 제외됨", msg: "다음 상품은 현재 가격표에 없어 견적에서 제외되었습니다 (최신 가격 기준):\n- " + missing.join("\n- "), buttons: [["확인", null, "pri"]] });
      else toast(`'${r.name}' 불러옴 (최신 가격 기준)`);
      return;
    }
  }
};

// 가격표가 새로 바뀌면: 견적함 가격은 자동으로 최신 가격, 없어진 상품은 빼고 알림
function refreshCartPrices(){
  if (!cart.entries.length){ renderCart(); return; }
  const { entries, missing } = entriesFromItems(cart.entries.map(e => ({ model_name: e.model, qty: e.qty, price_type: e.type })));
  cart.entries = entries; if (!entries.length) cart.loadedName = null;
  saveCart(); renderCart();
  if (missing.length) dialog({ title: "견적함 상품 제외", msg: "새 가격표에 없는 상품을 견적함에서 뺐습니다:\n- " + missing.join("\n- "), buttons: [["확인", null, "pri"]] });
}

/* ---------- 공용 대화상자 ---------- */
// buttons: [[글자, 값, "pri"?], ...]  /  input: {value, numeric}  /  list: [{name, sub}]
let dlgQueue = Promise.resolve();
let dlgCancel = null;          // 열려 있는 대화상자를 '취소'로 닫는 함수 (뒤로가기용)
function dialog(o){
  const p = dlgQueue.then(() => showDialog(o));   // 앞의 창이 닫힌 뒤에 다음 창 표시
  dlgQueue = p.catch(() => {});
  return p;
}
function showDialog(o){
  return new Promise(resolve => {
    const d = $("dlg"), inp = $("dlgInput"), lst = $("dlgList"), acts = $("dlgActs");
    $("dlgTitle").textContent = o.title || "";
    $("dlgMsg").textContent = o.msg || ""; $("dlgMsg").hidden = !o.msg;
    inp.hidden = !o.input; lst.hidden = !o.list;
    if (o.input){ inp.value = o.input.value || ""; inp.inputMode = o.input.numeric ? "numeric" : "text"; inp.type = "text"; }
    const done = v => { d.hidden = true; d.onclick = null; inp.onkeydown = null; dlgCancel = null; resolve(v); };
    dlgCancel = () => done(null);
    if (o.list){
      lst.innerHTML = o.list.map((x, i) => `<div class="qitem"><div class="t"><b>${esc(x.name)}</b><small>${esc(x.sub)}</small></div>
        <button class="b3d pri" data-l="load" data-i="${i}">불러오기</button><button class="b3d red" data-l="del" data-i="${i}">🗑</button></div>`).join("");
      lst.onclick = ev => { const b = ev.target.closest("[data-l]"); if (b) done({ btn: b.dataset.l, name: o.list[+b.dataset.i].name }); };
    }
    acts.innerHTML = "";
    for (const [label, val, cls] of o.buttons || [["확인", null]]){
      const b = document.createElement("button"); b.className = "b3d" + (cls ? " " + cls : ""); b.textContent = label;
      b.onclick = () => done({ btn: val, value: inp.value });
      acts.appendChild(b);
    }
    d.onclick = ev => { if (ev.target === d) done(null); };
    if (o.input) inp.onkeydown = ev => { if (ev.key === "Enter"){ const ok = (o.buttons || []).find(x => x[1] === "ok"); if (ok) done({ btn: "ok", value: inp.value }); } };
    d.hidden = false;
    if (o.input) setTimeout(() => { inp.focus(); inp.select(); }, 50);
  });
}

/* =========================================================
   검색 입력 이벤트
   ========================================================= */
function setMode(m){
  mode = m;
  $("tabAll").classList.toggle("on", m==="all");
  $("tabCmp").classList.toggle("on", m==="cmp");
  $("rowB").hidden = (m!=="cmp");
  $("tagA").hidden = (m!=="cmp");
  render();
}
$("tabAll").onclick = () => setMode("all");
$("tabCmp").onclick = () => { setMode("cmp"); if (!$("qB").value) $("qB").focus(); };
$("btnSwap").onclick = () => {
  const a = $("qA").value; $("qA").value = $("qB").value; $("qB").value = a;
  for (const id of ["qA","qB"]) $(id).parentElement.classList.toggle("has", !!$(id).value);
  render();
};
let renderTimer = null;
function scheduleRender(ms){ clearTimeout(renderTimer); renderTimer = setTimeout(render, ms); }
for (const id of ["qA","qB"]){
  $(id).addEventListener("input", e => { e.target.parentElement.classList.toggle("has", !!e.target.value); scheduleRender(80); });
  $(id).addEventListener("compositionupdate", () => scheduleRender(60));   // 한글 조합 중에도 실시간 검색
  $(id).addEventListener("keydown", e => { if (e.key==="Enter"){ e.target.blur(); render(); } });  // 엔터 → 즉시 검색 + 키보드 닫기
}
document.querySelectorAll(".clr").forEach(b => b.onclick = () => {
  const inp = $(b.dataset.for); inp.value = ""; inp.parentElement.classList.remove("has"); render(); inp.focus();
});
$("btnSync").onclick = async () => {
  if (syncing) return;
  const when = meta && meta.dataDate ? `\n(현재 가격표: ${meta.dataDate} 기준)` : "";
  const r = await dialog({ title: "데이터 받기",
    msg: "드라이브에서 최신 가격표를 받을까요?\n\n모바일 데이터 사용 시 요금이 발생할 수 있습니다." + when,
    buttons: [["아니오", null], ["예", "ok", "pri"]] });
  if (r && r.btn === "ok") sync(true);
};

// 검색 초기화 (PC 초기화와 동일): 두 검색창을 비우고 처음 화면으로
$("btnClearSearch").onclick = () => {
  clearTimeout(renderTimer);
  for (const id of ["qA","qB"]){ $(id).value = ""; $(id).parentElement.classList.remove("has"); }
  setMode("all");
  window.scrollTo(0, 0);
  $("qA").focus();
};

// 앱으로 돌아왔을 때 5분 지났으면 변경 확인
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && Date.now() - lastCheck > CHECK_INTERVAL_MS) sync(false);
});
setInterval(() => { if (!document.hidden) sync(false); }, CHECK_INTERVAL_MS);
window.addEventListener("online", () => sync(false));
// 모바일 데이터 → 와이파이로 바뀌면 미뤄둔 이미지 받기
try{ navigator.connection && navigator.connection.addEventListener("change", () => { if (imgMode === "auto" && imgPending && !onCellular()) checkImages(); }); }catch(e){}

/* =========================================================
   시작
   ========================================================= */
lsDel("rps_data"); lsDel("rps_cfg");   // 이전 버전 저장값 정리
if (loadCache()) showMetaStatus();
render();
renderCart();
updateImgInfo();
(async () => {
  if (imgMeta && imgMeta.count) { await loadImagesFromDb(); render(); }
  sync(false);
})();

// 오프라인 실행용 서비스워커
if ("serviceWorker" in navigator && location.protocol.startsWith("http")){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
